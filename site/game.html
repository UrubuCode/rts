<style>
  body { background: #0a0e17; margin: 0; }
  #wrap { width: 640px; margin: 24px auto; }
  #hud {
    color: #7dd3fc; font-size: 20px; font-weight: bold;
    text-align: center; padding: 12px 0; letter-spacing: 1px;
  }
  #placar { color: #f97316; }
  #arena {
    position: relative; width: 640px; height: 420px;
    background: #0c1220; border: 3px solid #2e7dd7; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .ball {
    position: absolute; width: 28px; height: 28px; border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #paddle {
    position: absolute; width: 14px; height: 90px; border-radius: 7px;
    background: #f97316; left: 12px; top: 165px;
  }
  #legenda { color: #64748b; font-size: 13px; text-align: center; padding-top: 10px; }
</style>
<div id="wrap">
  <div id="hud">RTS AUTO-PONG &middot; rebatidas: <span id="placar">0</span> &middot; frame <span id="frames">0</span></div>
  <div id="arena">
    <div id="paddle"></div>
    <div class="ball" id="b0" style="left:300px;top:60px;background:#22d3ee"></div>
    <div class="ball" id="b1" style="left:420px;top:220px;background:#a855f7"></div>
    <div class="ball" id="b2" style="left:200px;top:320px;background:#34d399"></div>
  </div>
  <div id="legenda">tres bolas quicando + uma raquete de IA que persegue a bola mais proxima &mdash; renderizado e jogado pelo motor do RTS</div>
</div>
<script>
  // AUTO-PONG: tres bolas quicam nas paredes; a raquete (IA) persegue a bola mais
  // proxima do lado esquerdo e conta as rebatidas. TODO o estado vive em atributos
  // do DOM (data-vx/data-vy/left/top) — o motor le e reescreve a cada frame, que e
  // exatamente o que exercita o pipeline de render (cascade + position:absolute +
  // mutacao por frame + cache de layout por revisao).
  //
  // O passo da fisica e a funcao global `step()`, chamada uma vez por frame pelo
  // loop do host (o loader). Cada bola guarda velocidade em data-vx/data-vy.

  const ARENA_W = 640;
  const ARENA_H = 420;
  const BALL = 28;
  const PADDLE_H = 90;

  function initBall(id, vx, vy) {
    const b = document.getElementById(id);
    if (b !== null) {
      b.setAttribute('data-vx', '' + vx);
      b.setAttribute('data-vy', '' + vy);
    }
  }
  initBall('b0', 5, 4);
  initBall('b1', -4, 5);
  initBall('b2', 6, -3);

  // contadores globais (persistem entre chamadas de step — sao module-scope).
  let frameCount = 0;
  let hits = 0;

  // le um numero de um atributo (string -> int via parse manual simples).
  function numAttr(el, name) {
    const s = el.getAttribute(name);
    if (s.length === 0) return 0;
    return parseInt(s, 10);
  }

  // avanca UMA bola: soma velocidade, quica nas 4 paredes, reescreve left/top.
  function stepBall(id) {
    const b = document.getElementById(id);
    if (b === null) return 0;
    let x = numAttr(b, 'data-x');
    let y = numAttr(b, 'data-y');
    // primeira vez: semeia data-x/data-y a partir do left/top inicial do style.
    if (b.getAttribute('data-init').length === 0) {
      x = numAttr2(b, 'left', 300);
      y = numAttr2(b, 'top', 60);
      b.setAttribute('data-init', '1');
    }
    let vx = numAttr(b, 'data-vx');
    let vy = numAttr(b, 'data-vy');
    x = x + vx;
    y = y + vy;
    if (x <= 0) { x = 0; vx = -vx; }
    if (x >= ARENA_W - BALL) { x = ARENA_W - BALL; vx = -vx; }
    if (y <= 0) { y = 0; vy = -vy; }
    if (y >= ARENA_H - BALL) { y = ARENA_H - BALL; vy = -vy; }
    b.setAttribute('data-x', '' + x);
    b.setAttribute('data-y', '' + y);
    b.setAttribute('data-vx', '' + vx);
    b.setAttribute('data-vy', '' + vy);
    b.setStyleProp('left', x + 'px');
    b.setStyleProp('top', y + 'px');
    return x;
  }

  // le "Npx" de um style prop e devolve o inteiro (ou o default).
  function numAttr2(el, prop, fallback) {
    const v = el.getStyleProp(prop);
    if (v.length === 0) return fallback;
    const n = parseInt(v, 10);
    return n;
  }

  // encontra a bola mais a ESQUERDA (a mais perto da raquete) e move a raquete
  // pra alinhar; conta rebatida quando uma bola encosta na coluna da raquete.
  function stepPaddle() {
    const p = document.getElementById('paddle');
    if (p === null) return;
    let bestY = 210;
    let bestX = 9999;
    const ids = ['b0', 'b1', 'b2'];
    let i = 0;
    while (i < 3) {
      const b = document.getElementById(ids[i]);
      if (b !== null) {
        const bx = numAttr(b, 'data-x');
        const by = numAttr(b, 'data-y');
        if (bx < bestX) { bestX = bx; bestY = by; }
      }
      i = i + 1;
    }
    // move a raquete suavemente na direcao da bola alvo.
    let py = numAttr2(p, 'top', 165);
    const alvo = bestY - (PADDLE_H / 2) + (BALL / 2);
    if (py < alvo) { py = py + 6; }
    if (py > alvo) { py = py - 6; }
    if (py < 0) { py = 0; }
    if (py > ARENA_H - PADDLE_H) { py = ARENA_H - PADDLE_H; }
    p.setStyleProp('top', py + 'px');
    // rebatida: bola chegou perto da coluna da raquete e esta na altura dela.
    if (bestX <= 34 && bestY + BALL >= py && bestY <= py + PADDLE_H) {
      hits = hits + 1;
      const placar = document.getElementById('placar');
      if (placar !== null) { placar.setInnerHTML('' + hits); }
    }
  }

  // passo global chamado pelo loop do host, um por frame.
  function step() {
    stepBall('b0');
    stepBall('b1');
    stepBall('b2');
    stepPaddle();
    frameCount = frameCount + 1;
    const f = document.getElementById('frames');
    if (f !== null) { f.setInnerHTML('' + frameCount); }
    return frameCount;
  }
</script>
