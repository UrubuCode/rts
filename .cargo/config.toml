# Cargo configuration for this workspace.

[build]
# Quantos `rustc` correm ao mesmo tempo. O padrao e o numero de CPUs logicas
# (16 nesta maquina), e o padrao e o errado aqui por uma razao que nao e a
# velocidade do build: um `cargo build --release` deste workspace com
# `lto = "thin"` e `codegen-units = 1` satura a maquina inteira por minutos, e
# durante esses minutos ela nao serve para mais nada.
#
# Oito e metade das logicas desta maquina: deixa folga para o resto do sistema
# e custa pouco, porque os crates grandes daqui compilam em serie de qualquer
# forma — `lto = "thin"` e a etapa de link nao paralelizam com os outros. O
# gargalo de um build de release deste projeto e a cauda, nao a largura.
#
# NAO MEDIDO: quanto exatamente o build alonga. Se isso passar a importar,
# `cargo build -j <n>` sobrepoe isto por invocacao, sem editar o arquivo.
jobs = 8

[env]
# The Rust TEST HARNESS runs each test on a spawned thread, whose default stack
# is 2 MiB — far smaller than the 8 MiB the process main thread gets. The
# engine's lowering and Cranelift's compile both recurse over their input, and
# building the compile path at `opt-level = 3` (see the per-package profiles in
# Cargo.toml) inlines more and so uses deeper frames. That combination overflowed
# a harness thread on a full `cargo test -p rts-codegen-new --lib` run, on tests
# that pass individually and via the CLI.
#
# Real usage is unaffected — `rts run` lowers on the main thread — so this raises
# the TEST threads to a comparable budget rather than papering over a defect.
RUST_MIN_STACK = "16777216"

# `opengl32.dll` is the single most expensive thing this binary does before
# `main` — Windows loads every statically imported DLL at process start, and
# opengl32 drags in the GPU driver stack. MEASURED, by delay-loading exactly one
# DLL at a time and timing `rts --version` (which compiles nothing):
#
#   nothing delayed .................. 78 ms
#   only mmdevapi.dll (audio) ........ 78 ms   <- audio costs ~0
#   only opengl32.dll ................ 14 ms   <- this one is ~64 ms of it
#
# It is imported because `rts-runtime` enables rts-egui's `glow-backend`
# alongside `wgpu-backend`: glow is the GL COMPATIBILITY FALLBACK for old GPUs
# (see rts-egui/Cargo.toml), so every `rts run` and `rts compile` paid 64 ms for
# a path almost nothing takes. DELAYLOAD defers it to the first actual GL call,
# which is exactly when the glow fallback engages.
#
# SCOPE IS ONE DLL, DELIBERATELY. A wider list (mmdevapi/dwmapi/uxtheme/imm32,
# and worse with crypt32/shell32/iphlpapi) destabilized the process: the
# unit-test binary crashed with STATUS_STACK_OVERFLOW and then
# STATUS_ILLEGAL_INSTRUCTION on the wide list, and on the narrow list stopped
# being reproducible (824/5 then 823/6, a different extra failure each run).
# opengl32 alone reproduces the baseline 825/4 across runs, holds the TS suite's
# failing-file list byte-identical, and carries ~64 of the ~65 ms — so the rest
# of the list is all risk and no reward.
#
# NOT VERIFIABLE HERE: the glow fallback itself needs an old GPU to engage, so
# only the wgpu/dx12 path was exercised (two window examples opened and ran).
# The delay-load stub covers direct imports, which is how glutin calls in.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-arg=/DELAYLOAD:opengl32.dll",
    "-C", "link-arg=delayimp.lib",
    # A PILHA DA THREAD PRINCIPAL, e ela e o que separa `rts run` de abrir uma
    # janela. 64 MiB, o mesmo que `rts-cli`'s `STACK` pede a thread que ele cria.
    #
    # O `rts run` cria uma thread NAO por gosto: recursao de JS estoura a pilha
    # padrao do Windows (~1 MiB). Mas o `winit` entra em panico ao criar o event
    # loop fora da thread principal, entao os dois requisitos se excluiam e a UI
    # virou um exemplo (`ui_fixture`) em vez do caminho normal.
    #
    # No Windows o tamanho da pilha da principal e decidido no LINK, nao em
    # execucao — entao dar a ela a mesma pilha remove a exclusao: profundidade de
    # recursao E janela na mesma thread.
    "-C", "link-arg=/STACK:67108864",
]
