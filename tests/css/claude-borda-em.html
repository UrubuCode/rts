<!DOCTYPE html>
<!-- Fixa: a largura de uma borda em `em`/`rem` resolve contra a fonte do
     elemento — no shorthand uniforme (`border: .3em solid`), no shorthand por
     lado (`border-left: .5em solid`) e no longhand (`border-top-width: 1em`).
     Aqui só px era lido: `.3em` caía e o lado ficava `medium` (3px), e o caret
     `.dropdown-toggle::after` do Bootstrap (só bordas de .3em) media 6 em vez
     de 9,6 — os 2px que faltavam ao botão do cover. A 20px de fonte: `#uni`
     mede 100+6+6, `#lado` 100+10 à esquerda, `#long` 100 de largura e
     50+20+? de altura (topo 1em=20, resto 0). -->
<html>
<head>
<meta name="fixar-estilo-em" content="uni,lado,long,caret">
<meta name="fixar-estilo" content="border-top-width,border-left-width">
<style>
  body { margin: 0; font: 20px/24px monospace; }
  div { width: 100px; height: 50px; background: #eee; margin-bottom: 10px; }
  #uni { border: .3em solid #c00; }
  #lado { border-left: .5em solid #0c0; }
  #long { border-style: solid; border-color: #00c; border-width: 0; border-top-width: 1em; }
  #caret { display: inline-block; width: 0; height: 0; border-top: .3em solid #000; border-right: .3em solid transparent; border-bottom: 0; border-left: .3em solid transparent; background: none; }
</style></head>
<body>
  <div id="uni"></div>
  <div id="lado"></div>
  <div id="long"></div>
  <div id="caret"></div>
</body>
</html>
