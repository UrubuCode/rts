<!DOCTYPE html>
<!-- Ruler (FM): the font metrics the whole inline model stands on, per generic
     family and size, as Blink has them. Each row is one line with
     `line-height: normal`: the row's height is the normal line height, the
     span's rect is the content area (ascent + descent), and the empty
     zero-height inline-block sits its bottom on the BASELINE, so its `y` splits
     the content area into ascent and descent. The engine had ONE metric for
     every family (ascent 0.90, descent 0.3125, normal 1.125 of the size),
     two independent calibrations that do not even add up. -->
<html>
<head>
<style>
  body { margin: 0; }
  .r { line-height: normal; }
  .b { display: inline-block; width: 1px; height: 0; }
</style></head>
