     descartada, não só destacada do que veio antes. Isso contradiz a regra
     do caso comum (que mantém a margem própria, só quebra a fusão com a
     anterior — ver `margin-collapse-clear-014`/`clear-clearance-
     calculation-004`, que têm a mesma margem própria a CONTAR). A condição
     que distingue os dois — o irmão anterior atravessar-se com um float
