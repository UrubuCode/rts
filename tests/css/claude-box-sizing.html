<!DOCTYPE html>
<!-- Fixa: `box-sizing: border-box` faz `width` incluir padding e border;
     `content-box` (padrão) não. Só a propriedade, sem layout à volta. -->
<html>
<head>
<meta name="fixar-estilo-em" content="conteudo-caixa,borda-caixa,percentual-borda">
<meta name="fixar-estilo" content="box-sizing">
<style>
  body { margin: 0; }
  div { height: 40px; margin-bottom: 10px; padding: 15px; border: 5px solid #000; width: 300px; }
  #conteudo-caixa { box-sizing: content-box; background: #fcc; }
  #borda-caixa { box-sizing: border-box; background: #cfc; }
  #percentual-borda { box-sizing: border-box; width: 50%; background: #ccf; }
</style></head>
<body>
  <div id="conteudo-caixa"></div>
  <div id="borda-caixa"></div>
  <div id="percentual-borda"></div>
</body>
</html>
