<!DOCTYPE html>
<!-- Fixa `:has()` nas três formas que `dom/has.rs` implementa: descendente
     (`.card:has(.err)`), filho direto (`.box:has(> img)`) e irmão seguinte
     (`.rotulo:has(+ .obrigatorio)`) — e o caso NEGATIVO de cada uma, para o
     desvio dizer se o motor casou DE MAIS (falso positivo, o erro caro) em
     vez de só "não casou". -->
<html>
<head>
<meta name="fixar-estilo-em" content="card-com-erro,card-sem-erro,box-filho,box-neto,rotulo-com,rotulo-sem">
<meta name="fixar-estilo" content="color">
<style>
  body { margin: 0; }
  div, span { color: #000000; }
  .card:has(.erro) { color: #ff0000; }
  .box:has(> img) { color: #ff0000; }
  .rotulo:has(+ .obrigatorio) { color: #ff0000; }
</style>
</head>
<body>
  <div class="card" id="card-com-erro"><span class="erro">campo inválido</span></div>
  <div class="card" id="card-sem-erro"><span>campo ok</span></div>

  <div class="box" id="box-filho"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></div>
  <div class="box" id="box-neto"><span><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></span></div>

  <span class="rotulo" id="rotulo-com">Nome</span><i class="obrigatorio">*</i>
  <span class="rotulo" id="rotulo-sem">Idade</span><i>opcional</i>
</body>
</html>
