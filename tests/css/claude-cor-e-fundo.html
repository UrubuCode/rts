<!DOCTYPE html>
<!-- Fixa: como o valor COMPUTADO de cor sai — `rgb(r, g, b)` sempre, seja a
     origem um nome, um hex de 3, um hex de 6 ou um `rgb()`. E que `color`
     herda enquanto `background-color` não. -->
<html>
<head>
<meta name="fixar-estilo-em" content="nome,hex3,hex6,funcional,herda-cor,sem-fundo,transparente">
<meta name="fixar-estilo" content="color,background-color">
<style>
  body { margin: 0; color: #123456; }
  #nome { color: red; background-color: blue; }
  #hex3 { color: #f00; background-color: #0f0; }
  #hex6 { color: #ff8800; background-color: #008800; }
  #funcional { color: rgb(10, 20, 30); background-color: rgba(0, 0, 0, 0.5); }
  #herda-cor { }
  #sem-fundo { }
  #transparente { background-color: transparent; }
</style></head>
<body>
  <div id="nome">a</div><div id="hex3">a</div><div id="hex6">a</div>
  <div id="funcional">a</div><div id="herda-cor">a</div>
  <div id="sem-fundo">a</div><div id="transparente">a</div>
</body>
</html>
