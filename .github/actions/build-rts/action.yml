name: Build RTS
description: >
  Build the `rts` binary. The AOT runtime archive is a TWO-STEP build: Cargo
  emits a `staticlib` only for a package built as a DIRECT TARGET, and being a
  direct dependency of the `rts` bin is not the same thing. So `rts-runtime`
  (which hosts the `__rtsadp_*` adapters under `src/adapters/`, folded in from
  the former `rts-adapters` crate) is built first, then the `rts` bin picks up
  the archive its build.rs embeds. Verified: without the pre-step the embedded
  archive is stale, carries no `__rtsadp_*` symbols, and AOT fails to link.

inputs:
  profile:
    description: "release | dev"
    required: false
    default: release

runs:
  using: composite
  steps:
    # On Windows we MUST NOT use git-bash: it puts `C:\Program Files\Git\usr\bin`
    # ahead on PATH, so rustc picks up MSYS `link.exe` instead of the MSVC linker
    # and the build script fails to link. pwsh keeps the MSVC env (msvc-dev-cmd)
    # intact.
    - name: Build (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [ "${{ inputs.profile }}" = "release" ]; then
          cargo build --release -p rts-runtime
          cargo build --release
        else
          cargo build -p rts-runtime
          cargo build
        fi

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if ('${{ inputs.profile }}' -eq 'release') {
          cargo build --release -p rts-runtime
          if ( -ne 0) { exit  }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } else {
          cargo build -p rts-runtime
          if ( -ne 0) { exit  }
          cargo build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
