name: Build RTS
description: >
  Build the `rts` binary. The AOT runtime archive is a TWO-STEP build: Cargo
  emits a `staticlib` only for a package built as a DIRECT TARGET, and being a
  direct dependency of the `rts` bin is not the same thing. So `rts-runtime`
  (which hosts the `__rtsadp_*` adapters under `src/adapters/`, folded in from
  the former `rts-adapters` crate) is built first, then the `rts` bin picks up
  the archive its build.rs embeds. Verified: without the pre-step the embedded
  archive is stale, carries no `__rtsadp_*` symbols, and AOT fails to link.

inputs:
  profile:
    description: "release | dev"
    required: false
    default: release

runs:
  using: composite
  steps:
    # On Windows we MUST NOT use git-bash: it puts `C:\Program Files\Git\usr\bin`
    # ahead on PATH, so rustc picks up MSYS `link.exe` instead of the MSVC linker
    # and the build script fails to link. pwsh keeps the MSVC env (msvc-dev-cmd)
    # intact.
    - name: Build (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Both runtime archives are built as DIRECT targets before the workspace
        # build, because cargo emits a `staticlib` only for a package it was asked
        # for by name — a plain `cargo build` produces the rlib and no archive.
        # `rts-runtime` is the archive without a compiler; `rts-runtime-jit` is
        # the one `rts compile` links BY DEFAULT since #2681, so leaving it out
        # made every AOT smoke fail with "no rts_runtime_jit.lib under
        # target/{debug,release,fast}" — which is what it did on ce1d8f069.
        if [ "${{ inputs.profile }}" = "release" ]; then
          cargo build --release -p rts-runtime
          cargo build --release -p rts-runtime-jit
          cargo build --release
        else
          cargo build -p rts-runtime
          cargo build -p rts-runtime-jit
          cargo build
        fi

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # See the Unix step for why both archives are named explicitly.
        if ('${{ inputs.profile }}' -eq 'release') {
          cargo build --release -p rts-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p rts-runtime-jit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } else {
          cargo build -p rts-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p rts-runtime-jit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
