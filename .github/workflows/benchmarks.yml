name: Benchmarks

on:
  workflow_run:
    workflows: ["Build Artifacts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of runs per benchmark"
        required: false
        default: "20"
      warmup:
        description: "Number of warmup runs"
        required: false
        default: "3"

permissions:
  contents: write      # auto-update of the README benchmark block
  actions: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            run_id=$(gh run list --workflow "Build Artifacts" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
            sha=$(gh run list --workflow "Build Artifacts" --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
            echo "run_id=$run_id" >> $GITHUB_OUTPUT
            echo "sha=$sha" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows RTS artifact
        uses: actions/download-artifact@v4
        with:
          # Build Artifacts uploads as `rts-<version>-Windows-X64`; match by
          # pattern since this workflow_run trigger has no version input.
          pattern: rts-*-Windows-X64
          merge-multiple: true
          path: rts-bin
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      # `rts compile` links against this, so the AOT half of the benchmark
      # cannot run without it. This job never builds the workspace — that is the
      # point of downloading a binary — so the archive has to arrive the same
      # way the binary does.
      - name: Download AOT runtime archive
        uses: actions/download-artifact@v4
        with:
          name: runtime-archive-Windows-X64
          path: rts-archive
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Stage RTS binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          # The Build Artifacts upload renames the binary to
          # `rts-<version>-Windows-X64.exe`, NOT `rts.exe`, so match ANY .exe in
          # the downloaded artifact (there is exactly one) rather than the literal
          # name — the old `-Filter rts.exe` never matched and failed the job.
          $exe = Get-ChildItem rts-bin -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "no .exe found in rts-bin/ (contents: $((Get-ChildItem rts-bin -Recurse | ForEach-Object FullName) -join ', '))" }
          Copy-Item $exe.FullName target/release/rts.exe
          Write-Host "staged $($exe.FullName) -> target/release/rts.exe"

          # Same directory, because that is where `rts compile` looks for it and
          # where `bench/benchmark.ps1` checks for it before running anything.
          $lib = Get-ChildItem rts-archive -Recurse -Filter rts_runtime.lib | Select-Object -First 1
          if (-not $lib) { throw "rts_runtime.lib not found in rts-archive/ (contents: $((Get-ChildItem rts-archive -Recurse | ForEach-Object FullName) -join ', '))" }
          Copy-Item $lib.FullName target/release/rts_runtime.lib
          Write-Host "staged $($lib.FullName) -> target/release/rts_runtime.lib"

          # `rts compile` refuses an archive OLDER than the sources, and it is
          # right to: a stale archive links yesterday's runtime into today's
          # program. The comparison is by modification time, and that proxy does
          # not survive artifact transport — the archive was built in an earlier
          # run, so its timestamp predates this run's checkout and every compile
          # would be refused for a staleness that is not real.
          #
          # Stamped rather than the check weakened: the binary and the archive
          # come from ONE build of ONE commit, which is the fact the timestamp
          # is standing in for.
          (Get-Item target/release/rts_runtime.lib).LastWriteTime = Get-Date
          (Get-Item target/release/rts.exe).LastWriteTime = Get-Date

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run benchmarks
        shell: pwsh
        env:
          RUNS: ${{ github.event.inputs.runs || '20' }}
          WARMUP: ${{ github.event.inputs.warmup || '3' }}
          GITHUB_SHA: ${{ steps.build.outputs.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path bench-output | Out-Null
          ./bench/benchmark.ps1 -Runs ([int]$env:RUNS) -Warmup ([int]$env:WARMUP) -JsonOut bench-output/results.json
          Write-Host "--- results.json ---"
          Get-Content bench-output/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.build.outputs.sha }}
          path: bench-output/results.json
          retention-days: 90

      # Auto-update the README benchmark block (same pattern as the
      # cross-runtime parity badge): rewrites the section between
      # <!-- BENCH_STATS_START --> / <!-- BENCH_STATS_END --> and commits.
      - name: Update README benchmark block
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'bench-output/results.json';
            if (!fs.existsSync(path)) { console.log('no results.json'); return; }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));

            const median = (bench, runner) => {
              const b = r.benches.find(x => x.id === bench);
              const e = b && b.runs.find(x => x.runner === runner);
              return e ? e.stats.median_ms : null;
            };
            const fmt = (ms) => ms == null ? '—' : (ms >= 1000
              ? (ms / 1000).toFixed(2) + ' s' : Math.round(ms) + ' ms');
            const ratio = (base, rts) => (base == null || rts == null || rts === 0)
              ? '—' : '**' + (base / rts).toFixed(2) + '×**';

            // One row per bench the matrix in `bench/benchmark.ps1` ACTUALLY
            // runs, and nothing else. The two lists had drifted apart in both
            // directions and each direction was its own defect:
            //
            //   `pi_bigfloat` and `monte_carlo_threaded` were listed here and
            //   are not in the matrix, so they could never be emitted — the
            //   loop below skips a row whose jit and aot are both null. A
            //   reader of this file saw two benchmarks that do not exist, and
            //   the second named "Bun Workers", which is the `thread` surface
            //   CLAUDE.md records as deliberately removed.
            //
            //   Six benches ran on every CI invocation and were thrown away:
            //   objbench, objbench_noalloc, objbench_methods, field_access,
            //   string_index and property_access. That is worse than the
            //   phantoms — it is measurement being paid for and discarded,
            //   which is the opposite of "coverage is measured, never claimed".
            //
            // The labels say what each one MEASURES rather than what it is
            // called, because most of them are only meaningful next to another
            // row: objbench minus objbench_noalloc is the allocation, and
            // property_access's own four lines are the cost of where state
            // lives.
            const ROWS = [
              { id: 'simple',               label: 'Hello/startup' },
              // These two share ONE RTS source, so their RTS JIT and RTS AOT
              // cells are the same run reported twice — what differs is the
              // `.js` on the other side of the comparison. Said in the label
              // because the table otherwise reads as two benchmarks that
              // happen to agree to the millisecond, which is the kind of
              // coincidence a reader is right to distrust.
              { id: 'monte_carlo',          label: 'Monte Carlo π 10M — vs the same xorshift in JS' },
              { id: 'monte_carlo_jsrand',   label: '…the same RTS run, vs JS using native `Math.random`' },
              { id: 'pi_machin',            label: 'π Machin f64 (RTS only)' },
              { id: 'objbench',             label: '3M objects allocated (RTS only)' },
              { id: 'objbench_noalloc',     label: '…the same loop without allocating — the difference is the collector' },
              { id: 'objbench_methods',     label: '3M objects, reached through a method (RTS only)' },
              { id: 'field_access',         label: 'two fields read from classes of 2/5/10/20 (RTS only)' },
              { id: 'string_index',         label: 'string indexing, input doubled four times (RTS only)' },
              { id: 'property_access',      label: 'one loop, state as a local / captured / property' },
            ];
            let table =
              '| Bench | Bun | Node | Deno | RTS JIT | **RTS AOT** | AOT vs Bun | AOT vs Node |\n' +
              '|---|---|---|---|---|---|---:|---:|\n';
            for (const row of ROWS) {
              const bun = median(row.id, 'bun');
              const node = median(row.id, 'node');
              const deno = median(row.id, 'deno');
              const jit = median(row.id, 'rts_jit');
              const aot = median(row.id, 'rts_aot');
              if (jit == null && aot == null) continue;
              table += `| ${row.label} | ${fmt(bun)} | ${fmt(node)} | ${fmt(deno)} ` +
                `| ${fmt(jit)} | **${fmt(aot)}** | ${ratio(bun, aot)} | ${ratio(node, aot)} |\n`;
            }

            const today = new Date().toISOString().slice(0, 10);
            const meta = r.meta || {};
            const stats = `### 📊 Measured benchmarks (auto-updated by CI)\n\n` +
              `End-to-end process time (includes startup/JIT compile), median of ` +
              `${meta.runs || '?'} runs after ${meta.warmup || '?'} warmups, ` +
              `GitHub Actions \`windows-latest\` — commit \`${meta.short_sha || '?'}\`.\n\n` +
              table + `\n_Updated: ${today} — run locally with ` +
              '`powershell -File bench/benchmark.ps1`_\n';

            let readme = fs.readFileSync('README.md', 'utf8');
            if (!/<!-- BENCH_STATS_START -->/.test(readme)) {
              console.log('README markers missing; skipping'); return;
            }
            readme = readme.replace(
              /<!-- BENCH_STATS_START -->[\s\S]*?<!-- BENCH_STATS_END -->/,
              `<!-- BENCH_STATS_START -->\n${stats}\n<!-- BENCH_STATS_END -->`
            );
            fs.writeFileSync('README.md', readme);

            const { execSync } = require('child_process');
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync('git add README.md');
            const changed = execSync('git status --porcelain README.md').toString().trim();
            if (!changed) { console.log('no README change'); return; }
            // COMMIT before pull --rebase: a staged/dirty index makes
            // `git pull --rebase` abort ("index contains uncommitted changes"),
            // which was failing this step the moment the benchmark first ran to
            // completion. Committing first leaves a clean tree, and the rebase
            // replays this commit on top of origin/main (the BENCH_STATS region
            // does not overlap the cross-runtime badge region, so no conflict).
            execSync('git commit -m "docs: auto-update benchmark table"');
            execSync('git pull --rebase origin main');
            execSync('git push origin HEAD:main');
