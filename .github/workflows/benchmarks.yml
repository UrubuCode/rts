name: Benchmarks

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      runs:
        description: "Numero de execucoes por benchmark"
        required: false
        default: "20"
      warmup:
        description: "Numero de warmup runs"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build RTS (release)
        run: cargo build --release

      - name: Run benchmarks
        shell: pwsh
        env:
          RUNS: ${{ github.event.inputs.runs || '20' }}
          WARMUP: ${{ github.event.inputs.warmup || '3' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path bench-output | Out-Null
          ./bench/benchmark.ps1 -Runs ([int]$env:RUNS) -Warmup ([int]$env:WARMUP) -JsonOut bench-output/results.json
          Write-Host "--- results.json ---"
          Get-Content bench-output/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: bench-output/results.json
          retention-days: 90
