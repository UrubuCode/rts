name: Benchmarks

on:
  workflow_run:
    workflows: ["Build Artifacts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: "Numero de execucoes por benchmark"
        required: false
        default: "20"
      warmup:
        description: "Numero de warmup runs"
        required: false
        default: "3"

permissions:
  contents: write      # auto-update of the README benchmark block
  actions: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            run_id=$(gh run list --workflow "Build Artifacts" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
            sha=$(gh run list --workflow "Build Artifacts" --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
            echo "run_id=$run_id" >> $GITHUB_OUTPUT
            echo "sha=$sha" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows RTS artifact
        uses: actions/download-artifact@v4
        with:
          # Build Artifacts uploads as `rts-<version>-Windows-X64`; match by
          # pattern since this workflow_run trigger has no version input.
          pattern: rts-*-Windows-X64
          merge-multiple: true
          path: rts-bin
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Stage RTS binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          $exe = Get-ChildItem rts-bin -Recurse -Filter rts.exe | Select-Object -First 1
          if (-not $exe) { throw "rts.exe nao encontrado em rts-bin/" }
          Copy-Item $exe.FullName target/release/rts.exe
          Write-Host "staged $($exe.FullName) -> target/release/rts.exe"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run benchmarks
        shell: pwsh
        env:
          RUNS: ${{ github.event.inputs.runs || '20' }}
          WARMUP: ${{ github.event.inputs.warmup || '3' }}
          GITHUB_SHA: ${{ steps.build.outputs.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path bench-output | Out-Null
          ./bench/benchmark.ps1 -Runs ([int]$env:RUNS) -Warmup ([int]$env:WARMUP) -JsonOut bench-output/results.json
          Write-Host "--- results.json ---"
          Get-Content bench-output/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.build.outputs.sha }}
          path: bench-output/results.json
          retention-days: 90

      # Auto-update the README benchmark block (same pattern as the
      # cross-runtime parity badge): rewrites the section between
      # <!-- BENCH_STATS_START --> / <!-- BENCH_STATS_END --> and commits.
      - name: Update README benchmark block
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'bench-output/results.json';
            if (!fs.existsSync(path)) { console.log('no results.json'); return; }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));

            const median = (bench, runner) => {
              const b = r.benches.find(x => x.id === bench);
              const e = b && b.runs.find(x => x.runner === runner);
              return e ? e.stats.median_ms : null;
            };
            const fmt = (ms) => ms == null ? '—' : (ms >= 1000
              ? (ms / 1000).toFixed(2) + ' s' : Math.round(ms) + ' ms');
            const ratio = (base, rts) => (base == null || rts == null || rts === 0)
              ? '—' : '**' + (base / rts).toFixed(2) + '×**';

            const ROWS = [
              { id: 'simple',               label: 'Hello/startup' },
              { id: 'monte_carlo',          label: 'Monte Carlo π 10M (same xorshift algorithm)' },
              { id: 'monte_carlo_jsrand',   label: 'Monte Carlo π 10M (JS `Math.random`)' },
              { id: 'pi_bigfloat',          label: 'π decimal ~30 digits (i128 vs BigInt)' },
              { id: 'monte_carlo_threaded', label: 'Monte Carlo 10M threaded (vs Bun Workers)' },
              { id: 'pi_machin',            label: 'π Machin f64 (RTS only)' },
            ];
            let table =
              '| Bench | Bun | Node | Deno | RTS JIT | **RTS AOT** | AOT vs Bun | AOT vs Node |\n' +
              '|---|---|---|---|---|---|---:|---:|\n';
            for (const row of ROWS) {
              const bun = median(row.id, 'bun');
              const node = median(row.id, 'node');
              const deno = median(row.id, 'deno');
              const jit = median(row.id, 'rts_jit');
              const aot = median(row.id, 'rts_aot');
              if (jit == null && aot == null) continue;
              table += `| ${row.label} | ${fmt(bun)} | ${fmt(node)} | ${fmt(deno)} ` +
                `| ${fmt(jit)} | **${fmt(aot)}** | ${ratio(bun, aot)} | ${ratio(node, aot)} |\n`;
            }

            const today = new Date().toISOString().slice(0, 10);
            const meta = r.meta || {};
            const stats = `### 📊 Measured benchmarks (auto-updated by CI)\n\n` +
              `End-to-end process time (includes startup/JIT compile), median of ` +
              `${meta.runs || '?'} runs after ${meta.warmup || '?'} warmups, ` +
              `GitHub Actions \`windows-latest\` — commit \`${meta.short_sha || '?'}\`.\n\n` +
              table + `\n_Updated: ${today} — run locally with ` +
              '`powershell -File bench/benchmark.ps1`_\n';

            let readme = fs.readFileSync('README.md', 'utf8');
            if (!/<!-- BENCH_STATS_START -->/.test(readme)) {
              console.log('README markers missing; skipping'); return;
            }
            readme = readme.replace(
              /<!-- BENCH_STATS_START -->[\s\S]*?<!-- BENCH_STATS_END -->/,
              `<!-- BENCH_STATS_START -->\n${stats}\n<!-- BENCH_STATS_END -->`
            );
            fs.writeFileSync('README.md', readme);

            const { execSync } = require('child_process');
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync('git add README.md');
            const changed = execSync('git status --porcelain README.md').toString().trim();
            if (!changed) { console.log('no README change'); return; }
            execSync('git pull --rebase origin main');
            execSync('git commit -m "docs: auto-update benchmark table"');
            execSync('git push origin HEAD:main');
