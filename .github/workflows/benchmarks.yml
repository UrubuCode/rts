name: Benchmarks

on:
  workflow_run:
    workflows: ["Build Artifacts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: "Numero de execucoes por benchmark"
        required: false
        default: "20"
      warmup:
        description: "Numero de warmup runs"
        required: false
        default: "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            run_id=$(gh run list --workflow "Build Artifacts" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
            sha=$(gh run list --workflow "Build Artifacts" --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
            echo "run_id=$run_id" >> $GITHUB_OUTPUT
            echo "sha=$sha" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows RTS artifact
        uses: actions/download-artifact@v4
        with:
          name: rts-Windows-X64
          path: rts-bin
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Stage RTS binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          $exe = Get-ChildItem rts-bin -Recurse -Filter rts.exe | Select-Object -First 1
          if (-not $exe) { throw "rts.exe nao encontrado em rts-bin/" }
          Copy-Item $exe.FullName target/release/rts.exe
          Write-Host "staged $($exe.FullName) -> target/release/rts.exe"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run benchmarks
        shell: pwsh
        env:
          RUNS: ${{ github.event.inputs.runs || '20' }}
          WARMUP: ${{ github.event.inputs.warmup || '3' }}
          GITHUB_SHA: ${{ steps.build.outputs.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path bench-output | Out-Null
          ./bench/benchmark.ps1 -Runs ([int]$env:RUNS) -Warmup ([int]$env:WARMUP) -JsonOut bench-output/results.json
          Write-Host "--- results.json ---"
          Get-Content bench-output/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.build.outputs.sha }}
          path: bench-output/results.json
          retention-days: 90
