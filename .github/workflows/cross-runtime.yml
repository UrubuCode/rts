name: Cross-Runtime Parity

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Semanal segunda 00:00 BRT (03:00 UTC) para detectar regressoes
    # em deps (Bun/Node) sem afetar horario comercial.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write    # auto-update do README
  issues: write      # auto-create de issue em divergencia
  pull-requests: write  # comentar em PR

jobs:
  cross-runtime:
    runs-on: ubuntu-latest
    # Reporta divergencias mas nao bloqueia merge — pull-request continua
    # passando mesmo se RTS divergir (issue eh aberta automaticamente).
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FLTK system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev \
            libglu1-mesa-dev libfontconfig1-dev libcairo2-dev jq

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build RTS (release)
        run: cargo build --release

      - name: Run cross-runtime check
        id: cross
        run: |
          RTS_BIN=target/release/rts \
          REPORT_FILE=$GITHUB_WORKSPACE/cross_runtime_report.json \
          bash scripts/cross_runtime_check.sh
        continue-on-error: true

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-runtime-report
          path: cross_runtime_report.json

      - name: PR comment with divergencias
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_WORKSPACE + '/cross_runtime_report.json';
            if (!fs.existsSync(path)) return;
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const s = r.summary;
            const divergent = r.results.filter(x => x.status === 'rts_diverge' || x.status === 'rts_error');

            let body = `## Cross-runtime parity (RTS vs Bun vs Node)\n\n`;
            body += `| Métrica | Valor |\n|---|---|\n`;
            body += `| Total | ${s.total} |\n`;
            body += `| ✅ Pass | ${s.pass} |\n`;
            body += `| ❌ RTS diverge | ${s.rts_diverge} |\n`;
            body += `| ⚠️ Bun ≠ Node | ${s.bun_node_diverge} |\n`;
            body += `| 💥 RTS error | ${s.errors} |\n`;
            body += `| 🚫 Rejeitados | ${s.rejected || 0} |\n\n`;

            if (divergent.length > 0) {
              body += `### Divergências detectadas\n\n`;
              for (const d of divergent) {
                body += `<details><summary><code>${d.name}</code> — ${d.status}</summary>\n\n`;
                body += `**Bun output:**\n\`\`\`\n${d.bun}\n\`\`\`\n\n`;
                body += `**Node output:**\n\`\`\`\n${d.node}\n\`\`\`\n\n`;
                body += `**RTS output:**\n\`\`\`\n${d.rts}\n\`\`\`\n\n`;
                body += `</details>\n\n`;
              }
            } else if (s.pass === s.total) {
              body += `🎉 Paridade completa.\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Atualizar README com % paridade (main + schedule)
        if: (github.event_name == 'push' || github.event_name == 'schedule') && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_WORKSPACE + '/cross_runtime_report.json';
            if (!fs.existsSync(path)) return;
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const s = r.summary;

            const validBase = s.pass + s.rts_diverge + s.errors;
            const pct = validBase > 0 ? Math.round((s.pass / validBase) * 1000) / 10 : 0;

            // Cor da badge baseada em %
            let color = 'red';
            if (pct >= 95) color = 'brightgreen';
            else if (pct >= 85) color = 'green';
            else if (pct >= 70) color = 'yellowgreen';
            else if (pct >= 50) color = 'yellow';
            else if (pct >= 30) color = 'orange';

            const badge = `[![Bun/Node parity](https://img.shields.io/badge/Bun%2FNode%20parity-${pct}%25-${color}?style=flat-square)](docs/specs/cross-runtime-testing.md)`;

            // Barra ASCII de progresso (20 segmentos).
            const segs = 20;
            const filled = validBase > 0 ? Math.round((s.pass / validBase) * segs) : 0;
            const bar = '▰'.repeat(filled) + '▱'.repeat(segs - filled);

            const today = new Date().toISOString().slice(0, 10);
            const remaining = (s.rts_diverge || 0) + (s.errors || 0);
            const stats = `## 🌐 Cross-runtime parity\n\n` +
              `Compatibilidade JS spec validada contra **Bun** e **Node** em ${s.total} fixtures TS standalone.\n\n` +
              `\`\`\`\n` +
              `[${bar}] ${pct}%   ${s.pass}/${validBase} fixtures passam\n` +
              `\`\`\`\n\n` +
              `| Métrica | Valor |\n|---|---|\n` +
              `| **Paridade** | **${pct}%** (${s.pass}/${validBase}) |\n` +
              `| ✅ RTS = Bun = Node | ${s.pass} |\n` +
              `| ❌ RTS diverge | ${s.rts_diverge} |\n` +
              `| 💥 RTS runtime error | ${s.errors} |\n` +
              `| 🛠️  **Falta corrigir** | **${remaining}** |\n` +
              `| ⚠️ Bun ≠ Node (skip) | ${s.bun_node_diverge} |\n` +
              `| 🚫 Rejeitados (RTS-only) | ${s.rejected || 0} |\n` +
              `| 📦 Total fixtures | ${s.total} |\n\n` +
              `_Atualizado: ${today} — [como adicionar fixture](docs/specs/cross-runtime-testing.md)_\n`;

            // Edita README entre marcadores
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- CROSS_RUNTIME_BADGE_START -->[\s\S]*?<!-- CROSS_RUNTIME_BADGE_END -->/,
              `<!-- CROSS_RUNTIME_BADGE_START -->\n${badge}\n<!-- CROSS_RUNTIME_BADGE_END -->`
            );
            readme = readme.replace(
              /<!-- CROSS_RUNTIME_STATS_START -->[\s\S]*?<!-- CROSS_RUNTIME_STATS_END -->/,
              `<!-- CROSS_RUNTIME_STATS_START -->\n${stats}\n<!-- CROSS_RUNTIME_STATS_END -->`
            );
            fs.writeFileSync('README.md', readme);

            // Copia o report pro repo (versionado em main para consumo externo).
            const { execSync } = require('child_process');
            try {
              fs.copyFileSync(path, 'cross_runtime_report.json');
            } catch (e) {
              console.log('Nao consegui copiar report:', e.message);
            }

            // Salva snapshot historico — só em schedule (1x semana). Push events
            // commitam o report mas não snapshot (evita inflar git history).
            const historyFiles = [];
            if (process.env.GITHUB_EVENT_NAME === 'schedule') {
              try {
                if (!fs.existsSync('cross_runtime_history')) {
                  fs.mkdirSync('cross_runtime_history', { recursive: true });
                }
                const histFile = `cross_runtime_history/${today}.json`;
                // Versao minificada do report: só summary + nomes dos divergentes
                // (não outputs completos — economiza espaco a longo prazo).
                const histData = {
                  date: today,
                  summary: s,
                  pct: pct,
                  divergent: r.results
                    .filter(x => x.status === 'rts_diverge' || x.status === 'rts_error')
                    .map(x => ({ name: x.name, status: x.status })),
                };
                fs.writeFileSync(histFile, JSON.stringify(histData, null, 2));
                historyFiles.push(histFile);

                // Atualiza index.json com lista cronologica para o dashboard
                // consumir facilmente. Apenas appenda data sem reescrever
                // historico antigo.
                const indexPath = 'cross_runtime_history/index.json';
                let index = { entries: [] };
                if (fs.existsSync(indexPath)) {
                  try { index = JSON.parse(fs.readFileSync(indexPath, 'utf8')); } catch (e) {}
                }
                // Remove entrada anterior do mesmo dia (re-run no mesmo dia
                // sobrescreve em vez de duplicar)
                index.entries = (index.entries || []).filter(e => e.date !== today);
                index.entries.push({
                  date: today,
                  pct: pct,
                  pass: s.pass,
                  total_valid: validBase,
                  total: s.total,
                  rts_diverge: s.rts_diverge,
                  errors: s.errors
                });
                index.entries.sort((a, b) => a.date.localeCompare(b.date));
                fs.writeFileSync(indexPath, JSON.stringify(index, null, 2));
                historyFiles.push(indexPath);
              } catch (e) {
                console.log('Falha ao salvar history:', e.message);
              }
            }

            // Commita se mudou
            const filesToCommit = ['README.md', 'cross_runtime_report.json', ...historyFiles];
            const diff = execSync(`git diff --stat ${filesToCommit.join(' ')}`).toString();
            const untracked = execSync('git ls-files --others --exclude-standard cross_runtime_history').toString();
            if (!diff.trim() && !untracked.trim()) {
              console.log('Nada mudou, sem commit.');
              return;
            }
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync(`git add ${filesToCommit.join(' ')}`);
            const msg = process.env.GITHUB_EVENT_NAME === 'schedule'
              ? `docs: cross-runtime parity ${pct}% + history snapshot ${today}`
              : `docs: auto-update cross-runtime parity badge (${pct}%)`;
            execSync(`git commit -m "${msg}"`);
            execSync('git push');

      - name: Auto-sync cross-runtime issues (GraphQL bulk + state-aware)
        # Roda tambem em push para main para fechar issues quando fixture
        # passa a bater. Sem isso, fixture resolvida ficava com issue OPEN.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && always()
        uses: actions/github-script@v7
        env:
          MAX_ISSUES_PER_RUN: "5"
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = process.env.GITHUB_WORKSPACE + '/cross_runtime_report.json';
            if (!fs.existsSync(path)) return;
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            // Conjuntos por fixture name:
            // - divergent: fixtures que diferem de Bun/Node nesta run
            // - passing: fixtures que passam (RTS = Bun = Node)
            const divergent = r.results.filter(x => x.status === 'rts_diverge' || x.status === 'rts_error');
            const passing = new Set(r.results.filter(x => x.status === 'pass').map(x => x.name));

            // Pausa entre requests para evitar secondary rate limit.
            // GitHub bloqueia bursts de criacao mesmo abaixo do primary
            // limit (5000/h). 2s entre operations mantem ~30 req/min,
            // bem dentro do safe.
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const THROTTLE_MS = 2000;

            const sha1 = (s) => crypto.createHash('sha1').update(s).digest('hex').slice(0, 12);
            // Normaliza outputs antes do hash para estabilizar sig entre
            // runs. RTS vaza handles GC (ex: 281474976710657) que mudam
            // a cada execucao por causa de alocacao round-robin em 32
            // shards do HandleTable. Substituimos runs de >= 12 digitos
            // por placeholder <handle>. Bun/Node nao tem esse problema
            // mas aplicamos por simetria.
            const normalizeOutput = (s) => (s || '').replace(/\b\d{12,}\b/g, '<handle>');
            const sigOf = (d) => sha1([
              d.name,
              d.status,
              normalizeOutput(d.bun),
              normalizeOutput(d.node),
              normalizeOutput(d.rts),
            ].join('|'));

            // ─── Categorização (apenas para label cat:<nome>) ───────
            function categorize(name) {
              const n = name.toLowerCase();
              if (/(stream|compression|textdecoder_stream|textencoder)/.test(n)) return 'streams';
              if (/(arraybuffer|dataview|typedarray|atomics|sharedarraybuffer)/.test(n)) return 'typed-buffers';
              if (/(blob|file|formdata|headers|request|response)/.test(n)) return 'web-api';
              if (/(abort[_]?controller|abort[_]?signal|event[_]?target|message[_]?channel|microtask|queuemicrotask)/.test(n)) return 'events-async';
              if (/(weak[_]?refs?|finalization[_]?registry)/.test(n)) return 'gc-weak';
              if (/(structured[_]?clone|domexception|aggregate[_]?error|modern_helpers|property_order)/.test(n)) return 'misc-platform';
              if (/intl/.test(n)) return 'intl';
              if (/regex/.test(n)) return 'regex';
              if (/url/.test(n)) return 'url';
              if (/(encodeuri|decodeuri|text_encoding|subtle_digest|encode_decode)/.test(n)) return 'encoding';
              if (/(bigint)/.test(n)) return 'bigint';
              if (/(json)/.test(n)) return 'json';
              if (/(generator|yield|yieldstar)/.test(n)) return 'generators';
              if (/(iterator_helpers|iterator_toarray)/.test(n)) return 'iteration';
              if (/(promise|await|promiseall|allsettled|withresolvers)/.test(n)) return 'promises';
              if (/(class|extends|super_|private_field|private_method|static_block|new_target|computed_class)/.test(n)) return 'classes';
              if (/(instanceof|typeof|error)/.test(n)) return 'classes-errors';
              if (/console/.test(n)) return 'console';
              if (/(function_meta|function_bind|function_call_apply|function_name_length|arrow_rest_params|arguments_object|new_target|closure)/.test(n)) return 'fn-meta';
              if (/(template|tagged_template|destructur|spread|labeled_break|delete_operator|void_operator|comma_operator|this_strict|hashbang|import_meta|numeric_separator|nullish_assignment|logical_assignment|optional_catch|exponentiation)/.test(n)) return 'syntax';
              if (/(coercion|number_format|nan_negative_zero|bitwise|number_tostring|number_constructor|number_valueof|number_parseint|number_parsefloat|number_isfinite|number_isinteger|number_issafeinteger|parseint|parsefloat|isfinite|isnan|tofixed|toexponential|toprecision)/.test(n)) return 'numeric';
              if (/math/.test(n)) return 'math';
              if (/date/.test(n)) return 'date';
              if (/boolean/.test(n)) return 'boolean';
              if (/array|findlast|findlastindex|flatmap|toreversed|tosorted|tospliced/.test(n)) return 'array';
              if (/(object|proxy|reflect)/.test(n)) return 'object-meta';
              if (/symbol/.test(n)) return 'symbol';
              if (/(map|set_operations|set_ops|map_set|groupby|map_iter|map_foreach)/.test(n)) return 'collections';
              if (/string|replaceall|matchall|substring|substr/.test(n)) return 'string';
              if (/(dynamic_import|setimmediate|setinterval)/.test(n)) return 'misc-platform';
              return 'other';
            }

            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Cap: maximo de issues criadas por run para nao inundar.
            // Default baixo (5) — pinga rate-limit safe; sobras esperam
            // proximo schedule (semanal). Override via env MAX_ISSUES_PER_RUN.
            const MAX_PER_RUN = parseInt(process.env.MAX_ISSUES_PER_RUN || '5', 10);

            // Coleta TODAS as issues cross-runtime (open + closed) via
            // GraphQL — 1 query traz 100 issues + body em uma chamada,
            // bem mais barato que REST paginado e dentro do safe rate.
            // Body eh truncado para 32 KB para evitar payload gigante;
            // os marker tags ficam no fim mas sempre <300 bytes.
            const fetchPage = async (cursor) => {
              const query = `query($owner: String!, $repo: String!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  issues(
                    first: 100,
                    after: $cursor,
                    states: [OPEN, CLOSED],
                    labels: ["cross-runtime"],
                    orderBy: { field: CREATED_AT, direction: DESC }
                  ) {
                    nodes { number, state, body, title }
                    pageInfo { hasNextPage, endCursor }
                  }
                }
              }`;
              return await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                cursor: cursor,
              });
            };

            let allIssues = [];
            let cursor = null;
            for (let page = 0; page < 20; page++) {
              const res = await fetchPage(cursor);
              const issues = res.repository.issues;
              allIssues.push(...issues.nodes);
              if (!issues.pageInfo.hasNextPage) break;
              cursor = issues.pageInfo.endCursor;
            }
            console.log(`GraphQL: ${allIssues.length} issues cross-runtime (all states)`);

            // Indexa por fixture name. Cada fixture pode ter multiplas
            // issues (OPEN + varias CLOSED de runs antigos); guardamos:
            // - openIssue: a unica OPEN existente (se houver)
            // - closedSigs: sigs ja vistas em qualquer issue CLOSED — pra
            //   bloquear recriacao quando a divergencia eh exatamente a
            //   mesma de antes
            const fixtureMap = new Map(); // name -> { openIssue?, closedSigs: Set, groupedRefs: Set }
            for (const issue of allIssues) {
              const body = issue.body || '';
              const fm = body.match(/<!-- cross-runtime-fixture: ([^\s]+) -->/);
              if (fm) {
                // Issue moderna (1 fixture, com marker).
                const sm = body.match(/<!-- cross-runtime-sig: ([a-f0-9]{12}) -->/);
                const sig = sm ? sm[1] : null;
                const name = fm[1];
                let entry = fixtureMap.get(name);
                if (!entry) {
                  entry = { openIssue: null, closedSigs: new Set(), groupedRefs: new Set() };
                  fixtureMap.set(name, entry);
                }
                if (issue.state === 'OPEN') {
                  if (!entry.openIssue) entry.openIssue = { ...issue, sig };
                } else {
                  if (sig) entry.closedSigs.add(sig);
                }
                continue;
              }
              // Fallback: issue agrupada antiga (sem marker). Reconhece
              // padrao \`### fixture_name —\` ou \`### \`fixture_name\` —\` no body
              // para popular groupedRefs. Sem isso, o dedup nao via essas
              // issues e o workflow criava duplicatas.
              const groupedNames = [...body.matchAll(/###\s+`?(\d+_\w+)`?\s+[—-]/g)].map(m => m[1]);
              for (const name of groupedNames) {
                let entry = fixtureMap.get(name);
                if (!entry) {
                  entry = { openIssue: null, closedSigs: new Set(), groupedRefs: new Set() };
                  fixtureMap.set(name, entry);
                }
                entry.groupedRefs.add(`#${issue.number}(${issue.state})`);
              }
            }

            // ─── PASSO 1: fechar issues OPEN cujas fixtures agora passam.
            let closed = 0;
            for (const [name, entry] of fixtureMap.entries()) {
              if (!entry.openIssue) continue;
              if (!passing.has(name)) continue;
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: entry.openIssue.number,
                  body: `✅ Fixture passa nesta run. Fechando automaticamente.\n\nRun: ${runUrl}`
                });
                await sleep(THROTTLE_MS);
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: entry.openIssue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                closed++;
                await sleep(THROTTLE_MS);
              } catch (e) {
                console.log(`Falha fechar #${entry.openIssue.number}: ${e.message}`);
                if (/secondary rate limit|abuse/i.test(e.message)) break;
              }
            }

            // ─── PASSO 2: processa divergencias.
            let created = 0;
            let updated = 0;
            let silentOpen = 0;       // OPEN + sig igual
            let silentClosed = 0;     // CLOSED + sig igual
            let skippedCap = 0;

            for (const d of divergent) {
              const sig = sigOf(d);
              const cat = categorize(d.name);
              const entry = fixtureMap.get(d.name);

              // ─── Caso A: ha issue OPEN para essa fixture
              if (entry && entry.openIssue) {
                if (entry.openIssue.sig === sig) {
                  // Mesma assinatura: silencio (issue OPEN ja eh sinal).
                  silentOpen++;
                  continue;
                }
                // Sig mudou: atualiza body. Mantem marker; appenda
                // sub-secao com novos outputs.
                const newBody = (entry.openIssue.body || '')
                  .replace(/<!-- cross-runtime-sig: [a-f0-9]{12} -->/, `<!-- cross-runtime-sig: ${sig} -->`)
                  + `\n\n### 🆕 Atualizado em ${today} (assinatura mudou)\n\n`
                  + `**Bun:**\n\`\`\`\n${d.bun}\n\`\`\`\n\n`
                  + `**Node:**\n\`\`\`\n${d.node}\n\`\`\`\n\n`
                  + `**RTS:**\n\`\`\`\n${d.rts}\n\`\`\`\n\n`
                  + `Run: ${runUrl}\n`;
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: entry.openIssue.number,
                    body: newBody
                  });
                  updated++;
                  await sleep(THROTTLE_MS);
                } catch (e) {
                  console.log(`Falha update #${entry.openIssue.number}: ${e.message}`);
                  if (/secondary rate limit|abuse/i.test(e.message)) break;
                }
                continue;
              }

              // ─── Caso B: sem issue OPEN. Checar se a sig ja foi vista
              // em issue CLOSED — se sim, foi resolvida e voltou identica,
              // skipamos pra evitar spam. Se sig nova, abrimos issue.
              if (entry && entry.closedSigs.has(sig)) {
                silentClosed++;
                continue;
              }

              // ─── Caso C: fixture aparece em issue agrupada antiga
              // (sem marker), provavelmente issue guarda-chuva listando
              // varias divergencias do mesmo run inicial. Skip silencioso
              // para nao duplicar. Quem quiser issue dedicada precisa
              // criar manualmente; ou extrair via cleanup script.
              if (entry && entry.groupedRefs.size > 0) {
                silentClosed++;
                continue;
              }

              // Nova issue (respeita cap).
              if (created >= MAX_PER_RUN) {
                skippedCap++;
                continue;
              }
              const statusEmoji = d.status === 'rts_error' ? '💥' : '❌';
              const title = `${statusEmoji} cross-runtime: ${d.name} — ${d.status}`;
              let fixtureCode = '';
              let fixtureRelPath = `tests/cross-runtime/${d.name}.ts`;
              try {
                // Fixtures sao organizadas em subpastas por categoria
                // (tests/cross-runtime/<cat>/<name>.ts). Busca recursiva.
                const base = `${process.env.GITHUB_WORKSPACE}/tests/cross-runtime`;
                function findFixture(dir) {
                  for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                    const full = `${dir}/${ent.name}`;
                    if (ent.isDirectory()) {
                      const sub = findFixture(full);
                      if (sub) return sub;
                    } else if (ent.name === `${d.name}.ts`) {
                      return full;
                    }
                  }
                  return null;
                }
                const p = findFixture(base);
                if (p) {
                  fixtureCode = fs.readFileSync(p, 'utf8');
                  fixtureRelPath = p.substring(process.env.GITHUB_WORKSPACE.length + 1).replace(/\\/g, '/');
                }
              } catch (e) {
                console.log(`Falha ler fixture ${d.name}: ${e.message}`);
              }
              let body = `## \`${d.name}\` — ${d.status}\n\n`;
              body += `Categoria: \`${cat}\`. Fixture: [\`${fixtureRelPath}\`](../blob/main/${fixtureRelPath})\n\n`;
              if (fixtureCode) body += `### Código do teste\n\n\`\`\`ts\n${fixtureCode}\n\`\`\`\n\n`;
              body += `### Outputs\n\n`;
              body += `**Bun:**\n\`\`\`\n${d.bun}\n\`\`\`\n\n`;
              body += `**Node:**\n\`\`\`\n${d.node}\n\`\`\`\n\n`;
              body += `**RTS:**\n\`\`\`\n${d.rts}\n\`\`\`\n\n`;
              body += `Detectado em: ${today}\nRun: ${runUrl}\n\n`;
              body += `<!-- cross-runtime-fixture: ${d.name} -->\n`;
              body += `<!-- cross-runtime-sig: ${sig} -->\n`;
              body += `<!-- cross-runtime-category: ${cat} -->\n`;
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title, body,
                  labels: ['cross-runtime', 'bug', `cat:${cat}`, `status:${d.status}`]
                });
                created++;
                await sleep(THROTTLE_MS);
              } catch (e) {
                console.log(`Erro criar issue ${d.name}: ${e.message}`);
                if (/secondary rate limit|abuse/i.test(e.message)) {
                  console.log('Secondary rate limit — abortando creates.');
                  break;
                }
              }
            }

            console.log(`closed:${closed} created:${created} updated:${updated} silentOpen:${silentOpen} silentClosed:${silentClosed} cap:${skippedCap}`);

            // ────────────────────────────────────────────────────────────
            // PASSO 3: tracking issues por categoria
            //
            // Mantem 1 issue por categoria (cat:array, cat:string, etc) com:
            // - checkbox-list de todas as fixtures da categoria
            // - barra de progresso (passing / total)
            // - links para issues filhas (modernas com marker OU grouped)
            // - atualizada a cada run; nunca duplica (lookup por marker
            //   <!-- cross-runtime-tracker: <cat> -->)
            // ────────────────────────────────────────────────────────────
            const allResults = r.results.filter(x =>
              x.status === 'pass' || x.status === 'rts_diverge' || x.status === 'rts_error'
            );
            const byCategory = new Map(); // cat -> [{name, status}, ...]
            for (const res of allResults) {
              const cat = categorize(res.name);
              if (!byCategory.has(cat)) byCategory.set(cat, []);
              byCategory.get(cat).push({ name: res.name, status: res.status });
            }

            // Indexa trackers existentes (busca marker proprio).
            const trackerByCategory = new Map();
            for (const issue of allIssues) {
              const tm = (issue.body || '').match(/<!-- cross-runtime-tracker: ([^\s]+) -->/);
              if (tm) trackerByCategory.set(tm[1], issue);
            }

            // Lookup rapido: fixture name -> issue (qualquer, OPEN ou
            // CLOSED, moderna ou agrupada).
            const issueRefForFixture = (name) => {
              const entry = fixtureMap.get(name);
              if (!entry) return null;
              if (entry.openIssue) return `#${entry.openIssue.number}`;
              if (entry.groupedRefs.size > 0) {
                // Pega o primeiro grouped ref (formato \"#N(STATE)\").
                return [...entry.groupedRefs][0].replace(/\((OPEN|CLOSED)\)/, '');
              }
              return null;
            };

            let trackersCreated = 0;
            let trackersUpdated = 0;
            let trackersSkipped = 0;

            for (const [cat, fixtures] of byCategory.entries()) {
              fixtures.sort((a, b) => a.name.localeCompare(b.name));
              const total = fixtures.length;
              const passing = fixtures.filter(f => f.status === 'pass').length;
              const pct = total > 0 ? Math.round((passing / total) * 1000) / 10 : 0;

              // Barra ASCII 20 segmentos.
              const segs = 20;
              const filled = total > 0 ? Math.round((passing / total) * segs) : 0;
              const bar = '▰'.repeat(filled) + '▱'.repeat(segs - filled);

              const title = `📊 cross-runtime [${cat}]: ${passing}/${total} (${pct}%)`;
              // Body "estavel" (sem timestamp/runUrl) usado SO' para
              // comparacao de diff. Se nada mudou desde o ultimo run,
              // skipamos o update — evita poluir historico com edicao
              // identica e nao spammar subscribers.
              const stableBody = (() => {
                let b = `## Tracker: categoria \`${cat}\`\n\n`;
                b += `\`\`\`\n[${bar}] ${pct}%  ${passing}/${total} fixtures passam\n\`\`\`\n\n`;
                b += `### Fixtures\n\n`;
                for (const f of fixtures) {
                  const checkbox = f.status === 'pass' ? '[x]' : '[ ]';
                  const emoji = f.status === 'pass' ? '✅' : (f.status === 'rts_error' ? '💥' : '❌');
                  const ref = issueRefForFixture(f.name);
                  const refLink = ref ? ` (${ref})` : '';
                  b += `- ${checkbox} ${emoji} \`${f.name}\`${refLink}\n`;
                }
                return b;
              })();
              // Body completo com timestamp/run, usado em creates e
              // updates reais.
              const body = stableBody
                .replace(/\n### Fixtures/, `\n**Atualizado em**: ${today} — [run](${runUrl})\n\n### Fixtures`)
                + `\n<!-- cross-runtime-tracker: ${cat} -->\n`;

              const existing = trackerByCategory.get(cat);
              try {
                if (existing) {
                  // Diff stable: extrai o stableBody atual da issue (tira
                  // a linha de "Atualizado em" e o marker) e compara.
                  const currentStable = (existing.body || '')
                    .replace(/\*\*Atualizado em\*\*:[^\n]*\n\n/, '')
                    .replace(/\n<!-- cross-runtime-tracker:[^>]+-->\n?/, '');
                  const wantedState = passing === total ? 'closed' : 'open';
                  const currentState = (existing.state || 'open').toLowerCase();
                  const wantedTitle = title;
                  const currentTitle = existing.title || '';

                  if (
                    currentStable.trim() === stableBody.trim() &&
                    currentState === wantedState &&
                    currentTitle === wantedTitle
                  ) {
                    // Nada mudou — skip silencioso.
                    trackersSkipped++;
                    continue;
                  }
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    title,
                    body,
                    state: wantedState,
                    state_reason: wantedState === 'closed' ? 'completed' : undefined,
                  });
                  trackersUpdated++;
                } else {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title, body,
                    labels: ['cross-runtime', 'tracking', `cat:${cat}`],
                  });
                  trackersCreated++;
                }
                await sleep(THROTTLE_MS);
              } catch (e) {
                console.log(`Tracker [${cat}] falhou: ${e.message}`);
                if (/secondary rate limit|abuse/i.test(e.message)) {
                  console.log('Secondary rate limit em trackers — abortando.');
                  break;
                }
              }
            }

            console.log(`trackersCreated:${trackersCreated} trackersUpdated:${trackersUpdated} trackersSkipped:${trackersSkipped}`);
