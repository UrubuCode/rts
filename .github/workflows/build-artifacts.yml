name: Build Artifacts

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Monday 03:00 UTC — runs the build + cross-runtime weekly to catch dep
    # regressions (Bun/Node) without depending on a push.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write       # create release on push to main + cross-runtime badge
  issues: write         # cross-runtime: auto-create issues on divergence
  pull-requests: write  # cross-runtime: PR comments

# A new push SUPERSEDES the previous build of the same ref: without this, every
# commit to main opened a new multi-hour build while the old ones stayed "in
# progress", piling up until the hosted runners saturated (the whole queue
# stalled — 2026-07-04, 17 stuck runs). Only the latest commit's build matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Compute version
        id: compute
        run: |
          # v0.0-<UTC timestamp YYYYMMDDHHMM>. Shared across the 3 build jobs
          # so the artifacts come out with the same version name.
          VERSION="v0.0-$(date -u +%Y%m%d%H%M)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed VERSION=$VERSION"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Job-level so the build composite's cargo invocation sees it (step-level env
    # on a `uses:` step is not forwarded into composite action steps).
    env:
      RTS_BUILD_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # AOT smoke linka ALSA (cpal no runtime archive → `snd_pcm_*`). O runner
      # traz a lib de runtime (libasound.so.2), mas não o symlink de dev
      # (libasound.so) que `-lasound` exige; o linker do rts proba o .so.2 por
      # caminho completo, e o -dev aqui deixa o caso canônico coberto também.
      # Retry: o apt do runner flakeia (ver cross-runtime.yml).
      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y libasound2-dev && break || sleep 5; done

      # MSVC env must be a job step: env it exports via GITHUB_ENV does not
      # propagate out of a composite action, so the bundled link.exe stays off
      # PATH and build.rs fails to link.
      - name: Setup MSVC env (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release
        uses: ./.github/actions/build-rts
        with:
          profile: release

      - name: Smoke test — rts run (JIT)
        run: target/release/rts run bench/pi_machin.ts
        shell: bash

      # BLOCKING AOT smoke: catches a placeholder runtime archive (staticlib not
      # built / wrong package) in the release binary itself. The ts-suite job's
      # AOT smoke is continue-on-error (#1288) and does not gate the release.
      - name: Smoke test — rts compile (AOT)
        shell: bash
        run: |
          rm -f smoke_aot smoke_aot.exe smoke_aot.obj smoke_aot.rtsdata
          target/release/rts compile bench/pi_machin.ts smoke_aot
          # Named, not globbed. `rts compile` leaves `smoke_aot.obj` beside the
          # binary, and the new engine's AOT also writes a `smoke_aot.rtsdata`
          # sidecar — so `./smoke_aot*` expands to several files and, when the
          # compile has FAILED, runs the `.obj` and reports "Exec format error"
          # instead of the real cause.
          if [ -x smoke_aot.exe ]; then ./smoke_aot.exe; else ./smoke_aot; fi

      # BLOCKING, and a different claim from the step above: that one asks
      # whether an AOT binary RUNS, this one asks whether it runs the same
      # PROGRAM the JIT does. Three files, so it also covers the module graph
      # `rts compile` refused outright until #2611 — and the `diff` is what
      # makes it a parity test rather than a smoke: a binary that starts and
      # answers `undefined` for `f.name` passes a smoke and fails this.
      - name: Smoke test — rts compile answers what rts run answers (AOT, module graph)
        shell: bash
        run: |
          rm -f smoke_graph smoke_graph.exe smoke_graph.obj smoke_graph.rtsdata
          target/release/rts run tests/aot/graph.ts > jit.txt
          target/release/rts compile tests/aot/graph.ts smoke_graph
          if [ -x smoke_graph.exe ]; then ./smoke_graph.exe > aot.txt; else ./smoke_graph > aot.txt; fi
          diff jit.txt aot.txt

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rts.exe "dist/rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}.exe"

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rts "dist/rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.exe
          if-no-files-found: error

      # The AOT runtime archive, for the Benchmarks workflow, which downloads a
      # built binary instead of compiling the workspace and therefore has no
      # `target/` of its own. `rts compile` links against this, so without it
      # every AOT bench is skipped — which is what it did, invisibly, until the
      # name in `bench/benchmark.ps1` was corrected and the absence became the
      # remaining cause.
      #
      # A SEPARATE artifact, not another file in the one above: the release job
      # publishes what it downloads, and a static library is not a release
      # asset. That is also why the release job matches artifacts by name.
      - name: Upload AOT runtime archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-archive-${{ runner.os }}-${{ runner.arch }}
          path: target/release/rts_runtime.lib
          if-no-files-found: error

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dist/rts-*
          if-no-files-found: error

  # Reuse the binary `build` already compiled — no second toolchain/compile.
  # Runs the TS suite + an AOT smoke against the downloaded release binary.
  ts-suite:
    needs: [version, build]
    # Non-blocking: macOS/Linux have a pre-existing TS-suite failure (#1288) and
    # are left red on purpose. Keeping it out of the workflow conclusion means it
    # does not gate the release job or the Benchmarks workflow (which fires only
    # when this workflow concludes success). Drop this once #1288 is fixed.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rts binary
        uses: actions/download-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dl

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p target/release
          # baixa em `dl` (NÃO `bin`): `bin/` tem o `bin/rts.exe` Windows commitado,
          # e `find bin | head -1` podia pegá-lo em vez do artefato desta plataforma
          # (→ "Exec format error" no Linux/macos). `dl` só tem o artefato baixado.
          f=$(find dl -type f | head -1)
          cp "$f" target/release/rts
          chmod +x target/release/rts

      - name: TS suite
        run: target/release/rts test

      # AOT smoke REMOVED from this job, and the reason is a real gap rather than
      # a flaky test. This job downloads the `rts` binary and has no cargo, and
      # since `rts compile` was cut over to the new engine it needs
      # `rts_runtime.lib` ON DISK — the old engine EMBEDDED its archive in the
      # binary and extracted it to ~/.rts/artifacts, and the new one has no
      # embedded fallback. So a DOWNLOADED `rts` cannot AOT-compile at all today.
      #
      # That is a product regression from the cutover, not a CI problem, and it is
      # recorded here rather than hidden behind a continue-on-error that always
      # fails: either the new archive gets embedded the way the old one was (it is
      # 151 MB, so that is a decision and not a detail), or it ships beside the
      # binary. The blocking AOT smoke in the `build` job still covers the
      # freshly-built case, which is what proves the compiler works.
      #
      # The program this used to compile was also wrong for the new engine —
      # `import { io } from "rts"` and `io.print` are surface it does not have.

  # As réguas do rts-dom, que até 2026-09-04 não corriam em lado nenhum do CI
  # (lente 6 da auditoria estrutural, docs/ui/html-engine/analises/): o corpus
  # CSS medido no Chrome (tests/css) sobre o binário Linux que `build` já fez,
  # e os testes Rust do crate e do bridge. Não bloqueia, como os outros três —
  # o CLAUDE.md diz porquê — mas uma fixture que deixe de passar fica VERMELHA
  # aqui em vez de só no terminal de quem se lembrar de correr o corredor.
  dom-rulers:
    needs: [version, build]
    # `needs: build` é a MATRIZ inteira, e o macOS está vermelho no smoke de
    # AOT desde 471bbbd2 (2026-09-03, anterior a este job): sem isto, este job
    # era SALTADO em todos os runs e a régua nunca corria — o primeiro run
    # provou-o. Corre sempre que o run não foi cancelado; o binário que lhe
    # interessa é o Linux, e se esse não existir o download falha por si.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rts binary
        uses: actions/download-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dl

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p target/release
          f=$(find dl -type f | head -1)
          cp "$f" target/release/rts
          chmod +x target/release/rts

      # O binário Linux carrega libasound.so.2 (cpal). Sem ela o processo nem
      # arranca, e um corredor que não arranca reportaria 0/49 — foi assim que
      # a badge cross-runtime deu 0% uma vez (ver cross-runtime.yml). Retry
      # porque o apt do runner flakeia, e um passo-guarda a seguir.
      - name: Install ALSA runtime
        run: |
          for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y libasound2-dev && break || sleep 5; done

      - name: Guard — the binary runs at all
        shell: bash
        run: test "$(target/release/rts -e 'console.log(41)')" = "41"

      - name: CSS corpus against Chrome (tests/css)
        shell: bash
        run: |
          set -o pipefail
          target/release/rts run examples/claude-css-runner.ts 2>&1 | tee corpus.txt
          resumo=$(grep -E '^passam: ' corpus.txt)
          { echo "### Corpus CSS (Chrome 1280x800, 1 px)"; echo; echo '```'; cat corpus.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # A regra do corpus é por FICHEIRO — mas uma fixture que falha DE
          # PROPÓSITO (nomeia uma lacuna medida; tests/css/README.md) não pode
          # deixar este check vermelho para sempre, senão ninguém o lê. A lista
          # em tests/css/esperado-a-falhar.txt é a expectativa: vermelho só se
          # cair uma fixture FORA dela; aviso se uma DA lista passar (a lista
          # ficou para trás e tem de ser encurtada no mesmo PR).
          echo "$resumo"
          grep -E '^  claude-[a-z0-9-]+\.html' corpus.txt | sed -E 's/^  (claude-[a-z0-9-]+\.html).*/\1/' | sort > falham.txt
          grep -vE '^\s*(#|$)' tests/css/esperado-a-falhar.txt | sort > esperadas.txt
          inesperadas=$(comm -23 falham.txt esperadas.txt)
          passaram=$(comm -13 falham.txt esperadas.txt)
          if [ -n "$passaram" ]; then echo "::warning::fixtures na lista esperado-a-falhar que PASSAM (encurte a lista): $passaram"; fi
          if [ -n "$inesperadas" ]; then echo "::error::fixtures a falhar FORA da lista esperado-a-falhar: $inesperadas"; exit 1; fi
          echo "so falham as esperadas: $(wc -l < esperadas.txt) ficheiro(s)"

      # A quarta régua: os REFTESTS do Web Platform Tests, rasterizados pelo
      # nosso motor e comparados pixel a pixel (scripts/wpt_reftests.md). O WPT
      # fica FIXADO num commit — uma régua que muda sozinha não é uma régua —
      # e só as pastas usadas entram (checkout esparso). O rasterizador é um
      # exemplo do rts-dom, que não tem dependências: constrói em ~1 min.
      # Report-only: o número vai para o README; um dia que desça vê-se lá.
      - name: Setup Rust (for the raster example)
        if: always()
        uses: ./.github/actions/setup-rust

      - name: Build the headless raster
        if: always()
        run: cargo build --release -p rts-dom --example claude-raster

      - name: WPT reftests (css-flexbox, pinned)
        if: always()
        shell: bash
        run: |
          set -e
          WPT_SHA=972e0e100fa754629cd00e549d6fa20a243af2bd
          git clone -q --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git "$RUNNER_TEMP/wpt"
          git -C "$RUNNER_TEMP/wpt" sparse-checkout set css/css-flexbox resources
          git -C "$RUNNER_TEMP/wpt" checkout -q "$WPT_SHA"
          node scripts/wpt_reftests.mjs "$RUNNER_TEMP/wpt/css/css-flexbox" --out "$RUNNER_TEMP/wpt-out" | tee wpt.txt
          { echo "### WPT reftests (css-flexbox @ ${WPT_SHA:0:9})"; echo; echo '```'; cat wpt.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .github && cp "$RUNNER_TEMP/wpt-out/relatorio.json" .github/wpt_report.json

      # O número do README é o que ESTE job mediu (o mesmo padrão do bloco
      # cross-runtime): regiões CSS_PARITY_BADGE / CSS_DOM_STATS e o JSON em
      # .github/. `always()` porque o passo acima sai 1 quando cai uma fixture
      # fora da lista — e é exactamente nesse dia que o número tem de descer à
      # vista. `pull --rebase` antes do push: o job cross-runtime também
      # escreve o README no mesmo run.
      - name: Update README with CSS/DOM parity (main)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test -f corpus.txt || { echo "sem corpus.txt — o corredor não correu"; exit 0; }
          node scripts/css_parity_readme.mjs corpus.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/css_parity_report.json .github/wpt_report.json
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          pct=$(node -e "console.log(require('./.github/css_parity_report.json').measurements.pct)")
          git commit -m "docs: auto-update CSS/DOM parity badge (${pct}%)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 10; done

  # Os testes Rust do rts-dom (sem dependências: segundos) e do rts-dom-bridge
  # (o teste de contrato que cruza o que a fachada chama com o que o bridge
  # regista — o que teria apanhado getBoundingClientRect morto). Perfil dev de
  # propósito: são dois crates, não os 41 binários que fazem o `--profile fast`
  # do CLAUDE.md valer a pena.
  dom-tests:
    needs: version
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: rts-dom and rts-dom-bridge tests
        run: cargo test -p rts-dom -p rts-dom-bridge --no-fail-fast

  # Reuses the Linux binary from `build` (no recompile). Runs as part of this
  # workflow so it keeps the PR/push context its badge/issue/comment steps need.
  cross-runtime:
    needs: [version, build]
    uses: ./.github/workflows/cross-runtime.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

  # A suíte do PRÓPRIO Node, no agendamento e não em cada push: são 3 543
  # ficheiros, um processo cada, e no runner isso são dezenas de minutos. A
  # percentagem move-se em semanas — pô-la à frente de cada pull request custava
  # a espera toda para medir o mesmo número.
  node-suite:
    if: github.event_name == 'schedule'
    needs: [version, build]
    uses: ./.github/workflows/node-suite.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write

  release:
    # Only create a release on push to main (not on PRs or dispatch).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # By NAME, not everything. The build also uploads the AOT runtime archive
      # for the Benchmarks workflow, and `files: artifacts/**/*` below would
      # publish a static library as a release asset. Matching `rts-*` keeps the
      # release exactly the three binaries it has always been.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rts-*
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body: |
            Automated build of `main` at ${{ needs.version.outputs.version }}.

            Commit: ${{ github.sha }}

            Binaries:
            - Linux x64
            - Windows x64
            - macOS ARM64
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
