name: Build Artifacts

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Monday 03:00 UTC — runs the build + cross-runtime weekly to catch dep
    # regressions (Bun/Node) without depending on a push.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write       # create release on push to main + cross-runtime badge
  issues: write         # cross-runtime: auto-create issues on divergence
  pull-requests: write  # cross-runtime: PR comments

# A new push SUPERSEDES the previous build of the same ref: without this, every
# commit to main opened a new multi-hour build while the old ones stayed "in
# progress", piling up until the hosted runners saturated (the whole queue
# stalled — 2026-07-04, 17 stuck runs). Only the latest commit's build matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Compute version
        id: compute
        run: |
          # v0.0-<UTC timestamp YYYYMMDDHHMM>. Shared across the 3 build jobs
          # so the artifacts come out with the same version name.
          VERSION="v0.0-$(date -u +%Y%m%d%H%M)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed VERSION=$VERSION"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Job-level so the build composite's cargo invocation sees it (step-level env
    # on a `uses:` step is not forwarded into composite action steps).
    env:
      RTS_BUILD_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # AOT smoke linka ALSA (cpal no runtime archive → `snd_pcm_*`). O runner
      # traz a lib de runtime (libasound.so.2), mas não o symlink de dev
      # (libasound.so) que `-lasound` exige; o linker do rts proba o .so.2 por
      # caminho completo, e o -dev aqui deixa o caso canônico coberto também.
      # Retry: o apt do runner flakeia (ver cross-runtime.yml).
      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y libasound2-dev && break || sleep 5; done

      # MSVC env must be a job step: env it exports via GITHUB_ENV does not
      # propagate out of a composite action, so the bundled link.exe stays off
      # PATH and build.rs fails to link.
      - name: Setup MSVC env (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release
        uses: ./.github/actions/build-rts
        with:
          profile: release

      - name: Smoke test — rts run (JIT)
        run: target/release/rts run bench/pi_machin.ts
        shell: bash

      # BLOCKING AOT smoke: catches a placeholder runtime archive (staticlib not
      # built / wrong package) in the release binary itself. The ts-suite job's
      # AOT smoke is continue-on-error (#1288) and does not gate the release.
      - name: Smoke test — rts compile (AOT)
        shell: bash
        run: |
          rm -f smoke_aot smoke_aot.exe smoke_aot.obj smoke_aot.rtsdata
          target/release/rts compile bench/pi_machin.ts smoke_aot
          # Named, not globbed. `rts compile` leaves `smoke_aot.obj` beside the
          # binary, and the new engine's AOT also writes a `smoke_aot.rtsdata`
          # sidecar — so `./smoke_aot*` expands to several files and, when the
          # compile has FAILED, runs the `.obj` and reports "Exec format error"
          # instead of the real cause.
          if [ -x smoke_aot.exe ]; then ./smoke_aot.exe; else ./smoke_aot; fi

      # BLOCKING, and a different claim from the step above: that one asks
      # whether an AOT binary RUNS, this one asks whether it runs the same
      # PROGRAM the JIT does. Three files, so it also covers the module graph
      # `rts compile` refused outright until #2611 — and the `diff` is what
      # makes it a parity test rather than a smoke: a binary that starts and
      # answers `undefined` for `f.name` passes a smoke and fails this.
      - name: Smoke test — rts compile answers what rts run answers (AOT, module graph)
        shell: bash
        run: |
          rm -f smoke_graph smoke_graph.exe smoke_graph.obj smoke_graph.rtsdata
          target/release/rts run tests/aot/graph.ts > jit.txt
          target/release/rts compile tests/aot/graph.ts smoke_graph
          if [ -x smoke_graph.exe ]; then ./smoke_graph.exe > aot.txt; else ./smoke_graph > aot.txt; fi
          diff jit.txt aot.txt

      # BLOCKING, and the claim is different again: not that the default
      # archive runs a program, but that it makes `eval` work inside a
      # compiled binary at all — plain `rts compile`, no flag, links
      # `rts-runtime-jit` now. `target/release/rts_runtime_jit.lib` exists
      # already — it is a direct dependency of this same `rts` bin (root
      # `Cargo.toml`), so the release build above already produced it,
      # exactly as it does for `rts_runtime.lib` — no second build step. The
      # fixture's page never ships without its `.exe`: `claude-pagina-eval.ts`
      # reads `claude-pagina-eval.html` off disk with `node:fs` at RUN time,
      # the same way `rts run` would, so this is a claim about the compiler
      # the binary carries and not about anything baked in at compile time.
      #
      # `--embed-compiler` is run too, and deliberately: it is the explicit
      # synonym of this same default, kept accepted so this exact step never
      # had to change when the default flipped — the claim it makes is that
      # the synonym still means what it always meant, not a second claim
      # about `eval`.
      - name: Smoke test — rts compile embeds a compiler by default; --embed-compiler still means the same thing (AOT)
        shell: bash
        run: |
          rm -f smoke_embed smoke_embed.exe smoke_embed.obj smoke_embed.rtsdata
          target/release/rts compile tests/aot/claude-pagina-eval.ts smoke_embed
          if [ -x smoke_embed.exe ]; then out=$(./smoke_embed.exe); else out=$(./smoke_embed); fi
          echo "eval(\"1+2\") inside the page's own <script>, default archive, answered: $out"
          [ "$out" = "3" ]
          rm -f smoke_embed smoke_embed.exe smoke_embed.obj smoke_embed.rtsdata
          target/release/rts compile --embed-compiler tests/aot/claude-pagina-eval.ts smoke_embed
          if [ -x smoke_embed.exe ]; then out=$(./smoke_embed.exe); else out=$(./smoke_embed); fi
          echo "eval(\"1+2\") inside the page's own <script>, --embed-compiler, answered: $out"
          [ "$out" = "3" ]

      # BLOCKING, and this is the OPT-OUT's own claim: `--sem-compilador`
      # links the small archive, which still refuses `eval` exactly as
      # `rts-host/README.md` states — the same source, same fixture, only the
      # archive changes. A binary this small should never silently gain a
      # compiler it did not ask for.
      #
      # The refusal is `console.error`, which this engine sends to STDERR —
      # checked there rather than on stdout, which answers the empty string
      # `dom.getText` gives back for a `textContent` `eval` never got to set.
      #
      # The exact wording changed with `aot-scripts-de-pagina` (#2679):
      # `page_scripts`'s hook is now installed on BOTH archives (empty table
      # on the small one, since this fixture has no `--html`), so a miss
      # raises `page_scripts`'s own, more specific `TypeError` — "not
      # pre-compiled into this AOT binary" — rather than the generic "a fonte
      # não compilou" this smoke used to check for.
      - name: Smoke test — rts compile --sem-compilador still refuses eval (AOT, small archive)
        shell: bash
        run: |
          rm -f smoke_small smoke_small.exe smoke_small.obj smoke_small.rtsdata
          target/release/rts compile --sem-compilador tests/aot/claude-pagina-eval.ts smoke_small
          if [ -x smoke_small.exe ]; then err=$(./smoke_small.exe 2>&1 1>/dev/null); else err=$(./smoke_small 2>&1 1>/dev/null); fi
          echo "eval(\"1+2\") inside the page's own <script>, --sem-compilador, stderr: $err"
          echo "$err" | grep -q "not pre-compiled into this AOT binary"

      # BLOCKING, and this is `--html`'s own claim: a page's <script> found by
      # the hash of its exact source runs on BOTH archives, with no compiler
      # needed at all on the small one. `tests/aot/claude-pagina-com-script.ts`
      # reads its `.html` off disk the same way `claude-pagina-eval.ts` does,
      # so this is a claim about what the BUILD precompiled, not about
      # anything the object references statically.
      - name: Smoke test — rts compile --html precompiles a page's <script> (AOT, both archives)
        shell: bash
        run: |
          rm -f smoke_html smoke_html.exe smoke_html.obj smoke_html.rtsdata
          target/release/rts compile --html tests/aot/claude-pagina-com-script.html tests/aot/claude-pagina-com-script.ts smoke_html
          if [ -x smoke_html.exe ]; then out=$(./smoke_html.exe); else out=$(./smoke_html); fi
          echo "--html, default archive: $out"
          echo "$out" | grep -q "textContent: ok"

          rm -f smoke_html smoke_html.exe smoke_html.obj smoke_html.rtsdata
          target/release/rts compile --html tests/aot/claude-pagina-com-script.html --sem-compilador tests/aot/claude-pagina-com-script.ts smoke_html
          if [ -x smoke_html.exe ]; then out=$(./smoke_html.exe); else out=$(./smoke_html); fi
          echo "--html, --sem-compilador (small archive): $out"
          echo "$out" | grep -q "textContent: ok"

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rts.exe "dist/rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}.exe"

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rts "dist/rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.exe
          if-no-files-found: error

      # The AOT runtime archives, for the Benchmarks workflow, which downloads
      # a built binary instead of compiling the workspace and therefore has no
      # `target/` of its own. `rts compile` links against one of these, so
      # without them every AOT bench is skipped — which is what it did,
      # invisibly, until the name in `bench/benchmark.ps1` was corrected and
      # the absence became the remaining cause.
      #
      # BOTH archives, since `rts compile` embeds a compiler by default now
      # and links `rts_runtime_jit.lib` unless told `--sem-compilador` —
      # a downstream consumer of only the small one would silently start
      # failing the moment it ran a plain `rts compile` rather than the flag.
      #
      # A SEPARATE artifact, not another file in the one above: the release job
      # publishes what it downloads, and a static library is not a release
      # asset. That is also why the release job matches artifacts by name.
      - name: Upload AOT runtime archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-archive-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/rts_runtime.lib
            target/release/rts_runtime_jit.lib
          if-no-files-found: error

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dist/rts-*
          if-no-files-found: error

  # Reuse the binary `build` already compiled — no second toolchain/compile.
  # Runs the TS suite + an AOT smoke against the downloaded release binary.
  ts-suite:
    needs: [version, build]
    # Non-blocking: macOS/Linux have a pre-existing TS-suite failure (#1288) and
    # are left red on purpose. Keeping it out of the workflow conclusion means it
    # does not gate the release job or the Benchmarks workflow (which fires only
    # when this workflow concludes success). Drop this once #1288 is fixed.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rts binary
        uses: actions/download-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dl

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p target/release
          # baixa em `dl` (NÃO `bin`): `bin/` tem o `bin/rts.exe` Windows commitado,
          # e `find bin | head -1` podia pegá-lo em vez do artefato desta plataforma
          # (→ "Exec format error" no Linux/macos). `dl` só tem o artefato baixado.
          f=$(find dl -type f | head -1)
          cp "$f" target/release/rts
          chmod +x target/release/rts

      - name: TS suite
        run: target/release/rts test

      # AOT smoke REMOVED from this job, and the reason is a real gap rather than
      # a flaky test. This job downloads the `rts` binary and has no cargo, and
      # since `rts compile` was cut over to the new engine it needs
      # `rts_runtime.lib` ON DISK — the old engine EMBEDDED its archive in the
      # binary and extracted it to ~/.rts/artifacts, and the new one has no
      # embedded fallback. So a DOWNLOADED `rts` cannot AOT-compile at all today.
      #
      # That is a product regression from the cutover, not a CI problem, and it is
      # recorded here rather than hidden behind a continue-on-error that always
      # fails: either the new archive gets embedded the way the old one was (it is
      # 151 MB, so that is a decision and not a detail), or it ships beside the
      # binary. The blocking AOT smoke in the `build` job still covers the
      # freshly-built case, which is what proves the compiler works.
      #
      # The program this used to compile was also wrong for the new engine —
      # `import { io } from "rts"` and `io.print` are surface it does not have.

  # As réguas do rts-dom, que até 2026-09-04 não corriam em lado nenhum do CI
  # (lente 6 da auditoria estrutural, docs/ui/html-engine/analises/): o corpus
  # CSS medido no Chrome (tests/css) sobre o binário Linux que `build` já fez,
  # e os testes Rust do crate e do bridge. Não bloqueia, como os outros três —
  # o CLAUDE.md diz porquê — mas uma fixture que deixe de passar fica VERMELHA
  # aqui em vez de só no terminal de quem se lembrar de correr o corredor.
  dom-rulers:
    needs: [version, build]
    # `needs: build` é a MATRIZ inteira, e o macOS está vermelho no smoke de
    # AOT desde 471bbbd2 (2026-09-03, anterior a este job): sem isto, este job
    # era SALTADO em todos os runs e a régua nunca corria — o primeiro run
    # provou-o. Corre sempre que o run não foi cancelado; o binário que lhe
    # interessa é o Linux, e se esse não existir o download falha por si.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rts binary
        uses: actions/download-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dl

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p target/release
          f=$(find dl -type f | head -1)
          cp "$f" target/release/rts
          chmod +x target/release/rts

      # O binário Linux carrega libasound.so.2 (cpal). Sem ela o processo nem
      # arranca, e um corredor que não arranca reportaria 0/49 — foi assim que
      # a badge cross-runtime deu 0% uma vez (ver cross-runtime.yml). Retry
      # porque o apt do runner flakeia, e um passo-guarda a seguir.
      - name: Install ALSA runtime
        run: |
          for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y libasound2-dev && break || sleep 5; done

      - name: Guard — the binary runs at all
        shell: bash
        run: test "$(target/release/rts -e 'console.log(41)')" = "41"

      - name: CSS corpus against Chrome (tests/css)
        shell: bash
        run: |
          set -o pipefail
          target/release/rts run examples/claude-css-runner.ts 2>&1 | tee corpus.txt
          resumo=$(grep -E '^passam: ' corpus.txt)
          { echo "### Corpus CSS (Chrome 1280x800, 1 px)"; echo; echo '```'; cat corpus.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # A regra do corpus é por FICHEIRO — mas uma fixture que falha DE
          # PROPÓSITO (nomeia uma lacuna medida; tests/css/README.md) não pode
          # deixar este check vermelho para sempre, senão ninguém o lê. A lista
          # em tests/css/esperado-a-falhar.txt é a expectativa: vermelho só se
          # cair uma fixture FORA dela; aviso se uma DA lista passar (a lista
          # ficou para trás e tem de ser encurtada no mesmo PR).
          echo "$resumo"
          grep -E '^  claude-[a-z0-9-]+\.html' corpus.txt | sed -E 's/^  (claude-[a-z0-9-]+\.html).*/\1/' | sort > falham.txt
          grep -vE '^\s*(#|$)' tests/css/esperado-a-falhar.txt | sort > esperadas.txt
          inesperadas=$(comm -23 falham.txt esperadas.txt)
          passaram=$(comm -13 falham.txt esperadas.txt)
          if [ -n "$passaram" ]; then echo "::warning::fixtures na lista esperado-a-falhar que PASSAM (encurte a lista): $passaram"; fi
          if [ -n "$inesperadas" ]; then echo "::error::fixtures a falhar FORA da lista esperado-a-falhar: $inesperadas"; exit 1; fi
          echo "so falham as esperadas: $(wc -l < esperadas.txt) ficheiro(s)"

      # A quarta régua: os REFTESTS do Web Platform Tests, rasterizados pelo
      # nosso motor e comparados pixel a pixel (scripts/wpt_reftests.md). O WPT
      # fica FIXADO num commit — uma régua que muda sozinha não é uma régua —
      # e só as pastas usadas entram (checkout esparso). O rasterizador é um
      # exemplo do rts-dom, que não tem dependências: constrói em ~1 min.
      # Report-only: o número vai para o README; um dia que desça vê-se lá.
      - name: Setup Rust (for the raster example)
        if: always()
        uses: ./.github/actions/setup-rust

      - name: Build the headless raster
        if: always()
        run: cargo build --release -p rts-dom --example claude-raster

      - name: WPT reftests (css-flexbox, pinned)
        if: always()
        shell: bash
        run: |
          set -e
          WPT_SHA=972e0e100fa754629cd00e549d6fa20a243af2bd
          git clone -q --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git "$RUNNER_TEMP/wpt"
          # `css` INTEIRO, e não `css/css-flexbox`: o corredor só aceita um
          # reftest cujo alvo de `rel=match` exista em disco, e muitos testes
          # de `css-flexbox` apontam para `../support/` e `/css/support/`,
          # fora da pasta. Com o checkout estreito esses eram descartados em
          # SILÊNCIO — 381 deles — e o número dizia 489 reftests onde a pasta
          # tem 870. `fonts` entra porque 5 487 testes do WPT usam a Ahem.
          git -C "$RUNNER_TEMP/wpt" sparse-checkout set css resources fonts
          git -C "$RUNNER_TEMP/wpt" checkout -q "$WPT_SHA"
          # SEM `--esperado`, e a razão é o que essa guarda protege. Ela existe
          # para a árvore PARTILHADA de uma máquina de trabalho, onde um
          # `sparse-checkout` de outra pessoa encolhe o corpus a meio de uma
          # medição. Aqui o checkout é criado do zero a cada corrida e fixado
          # num commit, portanto não há nada que o encolha — e um número fixo
          # no workflow passaria a ser uma segunda fonte da verdade sobre o
          # tamanho do corpus, que envelhece no dia em que `WPT_SHA` subir.
          # O total medido vai para `wpt_report.json` e para o README, que é
          # onde uma queda de denominador se vê.
          node scripts/wpt_reftests.mjs "$RUNNER_TEMP/wpt/css/css-flexbox" --out "$RUNNER_TEMP/wpt-out" | tee wpt.txt
          { echo "### WPT reftests (css-flexbox @ ${WPT_SHA:0:9})"; echo; echo '```'; cat wpt.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .github && cp "$RUNNER_TEMP/wpt-out/relatorio.json" .github/wpt_report.json

      # O número do README é o que ESTE job mediu (o mesmo padrão do bloco
      # cross-runtime): regiões CSS_PARITY_BADGE / CSS_DOM_STATS e o JSON em
      # .github/. `always()` porque o passo acima sai 1 quando cai uma fixture
      # fora da lista — e é exactamente nesse dia que o número tem de descer à
      # vista. `pull --rebase` antes do push: o job cross-runtime também
      # escreve o README no mesmo run.
      - name: Update README with CSS/DOM parity (main)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test -f corpus.txt || { echo "sem corpus.txt — o corredor não correu"; exit 0; }
          node scripts/css_parity_readme.mjs corpus.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/css_parity_report.json .github/wpt_report.json
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          pct=$(node -e "console.log(require('./.github/css_parity_report.json').measurements.pct)")
          git commit -m "docs: auto-update CSS/DOM parity badge (${pct}%)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 10; done

  # Os testes Rust do rts-dom (sem dependências: segundos) e do rts-dom-bridge
  # (o teste de contrato que cruza o que a fachada chama com o que o bridge
  # regista — o que teria apanhado getBoundingClientRect morto). Perfil dev de
  # propósito: são dois crates, não os 41 binários que fazem o `--profile fast`
  # do CLAUDE.md valer a pena.
  dom-tests:
    needs: version
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: rts-dom and rts-dom-bridge tests
        run: cargo test -p rts-dom -p rts-dom-bridge --no-fail-fast

  # A quinta régua, no mesmo espírito das anteriores: mede o custo de
  # empacotar a MESMA app (scripts/rts_vs_electron/app/index.html) em TRÊS
  # formas — um `.exe` Electron, um `.exe` RTS AOT (`rts compile`), e o
  # `rts.exe` do motor a correr o `.ts` fonte (JIT, `rts run`) — tamanho,
  # arranque, memória, CPU. Report-only, `continue-on-error`, pela mesma
  # razão de sempre: um runner hospedado sem ecrã pode não conseguir abrir a
  # janela mesmo com os artefactos certos ligados, e isso não é uma
  # regressão a bloquear a release.
  #
  # O `.exe` AOT ARRANCA e ABRE A JANELA desde 2026-09-04 (`rts:dom`/
  # `rts:egui` passaram a registar no runtime AOT, PR #2671). O JS DA PÁGINA
  # (o React, dentro de um `<script>` do HTML, via `runScriptsAt` em
  # `scripts/rts_vs_electron/rts/app.ts`) passa a correr TAMBÉM a partir
  # deste merge: `rts compile` (sem flag) embarca um compilador por omissão
  # agora (lote `aot-embed-compiler`) — `docs/engine/architecture.md`,
  # secção "Two AOT archives". `medir.mjs` lê o resultado real do stderr do
  # processo (campo `js_da_pagina`) em vez de assumido, e não foi
  # re-corrido aqui neste merge — o job continua a medir o que dá, em vez de
  # ficar vermelho por algo já registado ou verde por algo assumido.
  #
  # PORQUÊ este job NÃO compila nada: o job `build` já produz, para Windows,
  # exatamente os dois artefactos de que este precisa — o `rts.exe` de release
  # (upload `rts-<versão>-Windows-X64`, linha ~138 acima) E, à parte, o
  # `rts_runtime.lib` que `rts compile` liga (upload
  # `runtime-archive-Windows-X64`, linha ~156 acima — já existe por causa do
  # workflow Benchmarks). `benchmarks.yml` faz exatamente este download+stage
  # num `windows-latest` limpo, SEM `setup-rust` nem MSVC dev-cmd (o Rust e o
  # SDK do Windows do runner hospedado já chegam: `rts compile` prefere
  # `rust-lld` do toolchain via `rustup`/sysroot antes de procurar `link.exe`
  # no PATH — `crates/rts-linker/src/toolchain/discover.rs`), e corre
  # `rts compile` com sucesso a partir dele (`bench/benchmark.ps1`). É o padrão
  # mais barato já provado a funcionar neste repositório, por isso é o que este
  # job replica — em vez de um `cargo build -p rts-runtime` que custaria
  # minutos por corrida sem produzir nada que o `build` não tenha já.
  rts-vs-electron:
    needs: [version, build]
    # A mesma razão do `dom-rulers` acima: `needs: build` refere-se à MATRIZ
    # inteira, e uma perna (ex.: macOS) pode estar vermelha por algo alheio a
    # Windows — sem isto este job seria SALTADO sempre que isso acontecesse. O
    # binário que interessa aqui é o de Windows; se esse artefacto não existir,
    # o download da próxima etapa falha por si.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rts binary (Windows)
        uses: actions/download-artifact@v4
        with:
          name: rts-${{ needs.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: dl

      - name: Download AOT runtime archive
        uses: actions/download-artifact@v4
        with:
          name: runtime-archive-${{ runner.os }}-${{ runner.arch }}
          path: dl-archive

      - name: Stage rts.exe + rts_runtime.lib + rts_runtime_jit.lib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          # O upload do job `build` renomeia o binário para
          # `rts-<versão>-Windows-X64.exe`, não `rts.exe` — apanha o único .exe
          # que o download trouxe em vez do nome literal.
          $exe = Get-ChildItem dl -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "no .exe found in dl/ (contents: $((Get-ChildItem dl -Recurse | ForEach-Object FullName) -join ', '))" }
          Copy-Item $exe.FullName target/release/rts.exe

          # As DUAS: `rts compile` (sem flag) liga `rts_runtime_jit.lib` desde
          # que o compilador passou a ir por omissão — o app do comparativo
          # (`scripts/rts_vs_electron/rts/app.ts`) precisa dele para o
          # `runScriptsAt`/`eval` que corre a app React. `rts_runtime.lib`
          # fica trazida na mesma para quem testar `--sem-compilador` à mão.
          $lib = Get-ChildItem dl-archive -Recurse -Filter rts_runtime.lib | Select-Object -First 1
          if (-not $lib) { throw "rts_runtime.lib not found in dl-archive/ (contents: $((Get-ChildItem dl-archive -Recurse | ForEach-Object FullName) -join ', '))" }
          Copy-Item $lib.FullName target/release/rts_runtime.lib

          $libJit = Get-ChildItem dl-archive -Recurse -Filter rts_runtime_jit.lib | Select-Object -First 1
          if (-not $libJit) { throw "rts_runtime_jit.lib not found in dl-archive/ (contents: $((Get-ChildItem dl-archive -Recurse | ForEach-Object FullName) -join ', '))" }
          Copy-Item $libJit.FullName target/release/rts_runtime_jit.lib

          # `rts compile` recusa um archive mais velho que os `.rs` fonte que
          # verifica (proxy por mtime) — o transporte por artefacto não
          # preserva essa ordem. Binário e archives vêm de UMA build de UM
          # commit (mesmo padrão de `benchmarks.yml`), por isso a data é
          # simplesmente carimbada para agora em vez de a checagem ser
          # enfraquecida.
          (Get-Item target/release/rts_runtime.lib).LastWriteTime = Get-Date
          (Get-Item target/release/rts_runtime_jit.lib).LastWriteTime = Get-Date
          (Get-Item target/release/rts.exe).LastWriteTime = Get-Date

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/rts_vs_electron/electron/package.json

      # AOT do lado RTS. `--all-namespaces` embrulha o archive com
      # `/WHOLEARCHIVE` para os símbolos de TODOS os namespaces (incluindo
      # `rts:dom`/`rts:egui`) sobreviverem ao DCE do linker — sem esta flag o
      # `.exe` compila mas morre em runtime com "cannot resolve module
      # rts:egui" (a lacuna que existia até 2026-09-04, ver
      # `scripts/rts_vs_electron/rts/README.md`). O `continue-on-error` nesta
      # ÚNICA etapa é o que deixa o resto do job (empacotar o Electron, medir,
      # atualizar o README) correr de qualquer forma se até o LINK falhar —
      # `medir.mjs` já sabe reportar "não construído" com a razão real em vez
      # de o job abortar.
      - name: Compile RTS side (AOT)
        shell: pwsh
        continue-on-error: true
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "rts-vs-electron"
          New-Item -ItemType Directory -Force -Path "$tmp\rts" | Out-Null
          Copy-Item scripts\rts_vs_electron\app\index.html "$tmp\rts\app.html" -Force
          target\release\rts.exe compile --all-namespaces -p scripts\rts_vs_electron\rts\app.ts "$tmp\rts\app"

      # Empacotamento Electron, seguindo `scripts/rts_vs_electron/electron/README.md`
      # à letra: o `@electron/packager` só apanha ficheiros de DENTRO da pasta
      # onde corre, por isso a cópia vai para fora do repo (RUNNER_TEMP, o
      # equivalente em CI ao %TEMP% local) — nunca `npm install`/`dist` dentro
      # da árvore do repo. Sem `package-lock.json` (as duas dependências ficam
      # em "latest" de propósito, ver `electron/package.json`), por isso
      # `npm install` e não `npm ci`, que exige um lockfile.
      - name: Package Electron app
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "rts-vs-electron"
          New-Item -ItemType Directory -Force -Path "$tmp\electron\app" | Out-Null
          Copy-Item scripts\rts_vs_electron\electron\package.json "$tmp\electron\package.json" -Force
          Copy-Item scripts\rts_vs_electron\electron\main.js "$tmp\electron\main.js" -Force
          Copy-Item scripts\rts_vs_electron\app\index.html "$tmp\electron\app\index.html" -Force
          Push-Location "$tmp\electron"
          npm install
          npx @electron/packager . rts-vs-electron --platform=win32 --arch=x64 --out=dist --overwrite
          Pop-Location

      # N=3 em vez do 5 default local: este job empacota o Electron do zero a
      # cada corrida, e 3 tentativas por lado já dá um número estável dentro do
      # orçamento de tempo do runner. Caminhos passados explicitamente (em vez
      # de confiar nos defaults de `medir.mjs`, que usam `os.tmpdir()`/
      # `target/release`) para não depender de `TEMP`/`TMP` do runner
      # resolverem exatamente para `RUNNER_TEMP`, nem do cwd de onde o `node`
      # corre — fica explícito e verificável nesta etapa. O terceiro caminho
      # (`RTS_VS_ELECTRON_RTS_EXE_JIT`) aponta para o MESMO `rts.exe` já
      # encenado pela etapa "Stage rts.exe + rts_runtime.lib" acima — nenhuma
      # compilação nova para o lado JIT, só o binário que o job já tinha.
      - name: Measure (N=3 in CI, for time)
        shell: pwsh
        env:
          RTS_VS_ELECTRON_N: "3"
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "rts-vs-electron"
          $env:RTS_VS_ELECTRON_RTS_EXE = Join-Path $tmp "rts\app.exe"
          $env:RTS_VS_ELECTRON_ELECTRON_EXE = Join-Path $tmp "electron\dist\rts-vs-electron-win32-x64\rts-vs-electron.exe"
          $env:RTS_VS_ELECTRON_RTS_EXE_JIT = Join-Path (Get-Location) "target\release\rts.exe"
          node scripts/rts_vs_electron/medir.mjs

      - name: Update README with RTS vs Electron numbers
        shell: pwsh
        run: node scripts/rts_vs_electron_readme.mjs

      # Mesmo padrão do passo "Update README with CSS/DOM parity (main)"
      # acima: user.name/email, `git add` por nome, diff-check antes de
      # commitar, e o mesmo loop de `pull --rebase && push` com 3 tentativas.
      - name: Commit README + JSON (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/rts_vs_electron.json
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          exe_aot=$(node -e "const j=require('./.github/rts_vs_electron.json'); console.log(j.lados.rts_aot.bytes_exe!=null?(j.lados.rts_aot.bytes_exe/1024/1024).toFixed(1):'?')")
          exe_jit=$(node -e "const j=require('./.github/rts_vs_electron.json'); console.log(j.lados.rts_jit.bytes_exe!=null?(j.lados.rts_jit.bytes_exe/1024/1024).toFixed(1):'?')")
          exe_electron=$(node -e "const j=require('./.github/rts_vs_electron.json'); console.log(j.lados.electron.bytes_exe!=null?(j.lados.electron.bytes_exe/1024/1024).toFixed(1):'?')")
          git commit -m "docs: auto-update RTS vs Electron (AOT ${exe_aot} MB, JIT ${exe_jit} MB, Electron ${exe_electron} MB)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 10; done

  # Reuses the Linux binary from `build` (no recompile). Runs as part of this
  # workflow so it keeps the PR/push context its badge/issue/comment steps need.
  cross-runtime:
    needs: [version, build]
    uses: ./.github/workflows/cross-runtime.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

  # A suíte do PRÓPRIO Node, no agendamento e não em cada push: são 3 543
  # ficheiros, um processo cada, e no runner isso são dezenas de minutos. A
  # percentagem move-se em semanas — pô-la à frente de cada pull request custava
  # a espera toda para medir o mesmo número.
  node-suite:
    if: github.event_name == 'schedule'
    needs: [version, build]
    uses: ./.github/workflows/node-suite.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write

  release:
    # Only create a release on push to main (not on PRs or dispatch).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # By NAME, not everything. The build also uploads the AOT runtime archive
      # for the Benchmarks workflow, and `files: artifacts/**/*` below would
      # publish a static library as a release asset. Matching `rts-*` keeps the
      # release exactly the three binaries it has always been.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rts-*
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body: |
            Automated build of `main` at ${{ needs.version.outputs.version }}.

            Commit: ${{ github.sha }}

            Binaries:
            - Linux x64
            - Windows x64
            - macOS ARM64
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
