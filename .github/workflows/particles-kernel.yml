name: Particles Kernel

# `rts-particles` (`rts:particles`, `particlesStep`) é um crate numérico puro
# — sem GPU, sem dispositivo de áudio, sem plataforma a mockar — então roda
# a suíte inteira (unit + paridade) nos três SOs a cada push/PR que o toca,
# com warnings como erro (o brief pede isto explicitamente, e é barato: o
# crate não puxa wgpu/cpal). Não usa o binário publicado por
# `build-artifacts.yml`; compila só este crate e o que ele depende
# (`rts-core`), rápido o bastante para não precisar de `workflow_call`.

on:
  push:
    branches: [main]
    paths:
      - "crates/rts-particles/**"
      - "crates/rts-core/**"
      - ".github/workflows/particles-kernel.yml"
  pull_request:
    paths:
      - "crates/rts-particles/**"
      - "crates/rts-core/**"
      - ".github/workflows/particles-kernel.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: particles-kernel-${{ matrix.os }}

      - name: cargo test -p rts-particles (debug)
        run: cargo test -p rts-particles --all-targets

      - name: cargo test -p rts-particles (release, inclui paridade)
        run: cargo test --release -p rts-particles --all-targets

      - name: cargo build --release -p rts-particles
        run: cargo build --release -p rts-particles
