name: Deploy Pages

on:
  workflow_run:
    workflows: ["Build Artifacts", "Cross-Runtime Parity"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'cross_runtime_report.json'
      - 'cross_runtime_history/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect last N successful builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_BUILDS: 10
        run: |
          mkdir -p site/downloads
          echo "[" > site/builds.json
          first=1

          RUNS=$(gh run list --workflow "Build Artifacts" --branch main --status success --limit $MAX_BUILDS --json databaseId,headSha,createdAt,displayTitle)
          echo "$RUNS" | jq -c '.[]' | while read -r run; do
            run_id=$(echo "$run" | jq -r '.databaseId')
            sha=$(echo "$run" | jq -r '.headSha')
            short_sha=${sha:0:7}
            created=$(echo "$run" | jq -r '.createdAt')
            title=$(echo "$run" | jq -r '.displayTitle' | sed 's/"/\\"/g')

            echo "Processing run $run_id ($short_sha)"
            tmpdir=$(mktemp -d)
            if ! gh run download "$run_id" -D "$tmpdir" 2>/dev/null; then
              echo "  skip: artifacts expired or unavailable"
              rm -rf "$tmpdir"
              continue
            fi

            build_dir="site/downloads/$short_sha"
            mkdir -p "$build_dir"
            artifacts_json="["
            first_art=1
            for dir in "$tmpdir"/rts-*; do
              [ -d "$dir" ] || continue
              name=$(basename "$dir")
              file=$(ls "$dir" | head -1)
              [ -z "$file" ] && continue
              mkdir -p "$build_dir/$name"
              cp "$dir/$file" "$build_dir/$name/$file"
              size=$(stat -c%s "$build_dir/$name/$file")
              size_mb=$(awk "BEGIN { printf \"%.1f\", $size / 1048576 }")
              [ $first_art -eq 0 ] && artifacts_json="$artifacts_json,"
              artifacts_json="$artifacts_json{\"name\":\"$name\",\"file\":\"$file\",\"path\":\"downloads/$short_sha/$name/$file\",\"size_mb\":\"$size_mb\"}"
              first_art=0
            done
            artifacts_json="$artifacts_json]"
            rm -rf "$tmpdir"

            if [ "$artifacts_json" = "[]" ]; then
              rm -rf "$build_dir"
              continue
            fi

            [ $first -eq 0 ] && echo "," >> site/builds.json
            cat >> site/builds.json <<JSON
          {"sha":"$sha","short_sha":"$short_sha","created":"$created","title":"$title","run_id":"$run_id","artifacts":$artifacts_json}
          JSON
            first=0
          done
          echo "]" >> site/builds.json
          cat site/builds.json | jq . | head -40

      - name: Generate index.html
        env:
          REPO: ${{ github.repository }}
        run: |
          cd site
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat > index.html <<HTMLEOF
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>RTS — Builds</title>
            <style>
              :root {
                --bg: #0d1117;
                --fg: #e6edf3;
                --muted: #7d8590;
                --accent: #f78166;
                --card: #161b22;
                --border: #30363d;
                --link: #2f81f7;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                background: var(--bg);
                color: var(--fg);
                line-height: 1.6;
                min-height: 100vh;
                padding: 2rem 1rem;
              }
              .container { max-width: 1100px; margin: 0 auto; }
              header { margin-bottom: 3rem; text-align: center; }
              h1 {
                font-size: 3rem;
                font-weight: 700;
                background: linear-gradient(135deg, var(--accent), var(--link));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 0.5rem;
              }
              .tagline { color: var(--muted); font-size: 1.1rem; }
              .meta {
                display: flex;
                gap: 1rem;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 1rem;
                font-size: 0.9rem;
                color: var(--muted);
              }
              .meta a { color: var(--link); text-decoration: none; }
              .meta a:hover { text-decoration: underline; }
              h2 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
                color: var(--fg);
                border-bottom: 1px solid var(--border);
                padding-bottom: 0.5rem;
              }
              .build {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-bottom: 1rem;
                overflow: hidden;
              }
              .build.latest { border-color: var(--accent); }
              .build-header {
                padding: 1rem 1.5rem;
                cursor: pointer;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
                user-select: none;
                transition: background 0.15s;
              }
              .build-header:hover { background: rgba(255,255,255,0.02); }
              .build-info { flex: 1; min-width: 0; }
              .build-title {
                font-weight: 600;
                margin-bottom: 0.25rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
              }
              .build-meta {
                font-size: 0.85rem;
                color: var(--muted);
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
              }
              .build-meta a { color: var(--link); text-decoration: none; font-family: 'SF Mono', monospace; }
              .build-meta a:hover { text-decoration: underline; }
              .badge {
                background: var(--accent);
                color: #fff;
                font-size: 0.7rem;
                padding: 0.15rem 0.5rem;
                border-radius: 10px;
                font-weight: 500;
                text-transform: uppercase;
              }
              .toggle {
                color: var(--muted);
                font-size: 1.2rem;
                transition: transform 0.2s;
              }
              .build.open .toggle { transform: rotate(90deg); }
              .build-body {
                display: none;
                padding: 0 1.5rem 1.5rem;
                border-top: 1px solid var(--border);
              }
              .build.open .build-body { display: block; }
              .cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 0.75rem;
                padding-top: 1rem;
              }
              .card {
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 1rem;
              }
              .platform {
                font-size: 1rem;
                font-weight: 600;
                margin-bottom: 0.5rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
              }
              .icon { font-size: 1.2rem; }
              .filename {
                font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
                font-size: 0.75rem;
                color: var(--muted);
                word-break: break-all;
                margin-bottom: 0.25rem;
              }
              .size { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.75rem; }
              .download {
                display: inline-block;
                background: var(--accent);
                color: #fff;
                padding: 0.4rem 0.8rem;
                border-radius: 4px;
                text-decoration: none;
                font-weight: 500;
                font-size: 0.85rem;
                transition: opacity 0.15s;
              }
              .download:hover { opacity: 0.85; }
              footer {
                text-align: center;
                color: var(--muted);
                font-size: 0.85rem;
                margin-top: 3rem;
                padding-top: 2rem;
                border-top: 1px solid var(--border);
              }
              footer a { color: var(--link); text-decoration: none; }
              .empty {
                text-align: center;
                padding: 3rem;
                color: var(--muted);
              }
            </style>
          </head>
          <body>
            <div class="container">
              <header>
                <h1>RTS</h1>
                <p class="tagline">TypeScript-to-native compiler &amp; runtime — Cranelift backend</p>
                <div class="meta">
                  <span>Atualizado: $DATE</span>
                  <span><a href="https://github.com/$REPO">GitHub →</a></span>
                </div>
              </header>

              <h2>Builds recentes</h2>
              <div id="builds"><div class="empty">Carregando...</div></div>

              <footer>
                <p>Builds gerados pelo workflow <a href="https://github.com/$REPO/actions/workflows/build-artifacts.yml">Build Artifacts</a>. Clique num build pra expandir os downloads.</p>
              </footer>
            </div>

            <script>
              const ICONS = { Linux: '🐧', macOS: '🍎', Windows: '🪟' };
              const REPO = "$REPO";
              fetch('builds.json').then(r => r.json()).then(builds => {
                const container = document.getElementById('builds');
                if (!builds.length) {
                  container.innerHTML = '<div class="empty">Nenhum build com artefatos disponivel.</div>';
                  return;
                }
                container.innerHTML = builds.map((b, idx) => {
                  const dt = new Date(b.created);
                  const dateStr = dt.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
                  const cards = b.artifacts.map(a => {
                    const platform = a.name.replace('rts-', '').replace(/-X64\$/, '');
                    const icon = ICONS[platform] || '📦';
                    return \`
                      <div class="card">
                        <div class="platform"><span class="icon">\${icon}</span>\${platform}</div>
                        <div class="filename">\${a.file}</div>
                        <div class="size">\${a.size_mb} MB</div>
                        <a class="download" href="\${a.path}" download>Download</a>
                      </div>\`;
                  }).join('');
                  const latestBadge = idx === 0 ? '<span class="badge">latest</span>' : '';
                  return \`
                    <div class="build \${idx === 0 ? 'open latest' : ''}">
                      <div class="build-header" onclick="this.parentElement.classList.toggle('open')">
                        <div class="build-info">
                          <div class="build-title">\${b.title} \${latestBadge}</div>
                          <div class="build-meta">
                            <a href="https://github.com/\${REPO}/commit/\${b.sha}">\${b.short_sha}</a>
                            <span>\${dateStr}</span>
                            <a href="https://github.com/\${REPO}/actions/runs/\${b.run_id}">run #\${b.run_id}</a>
                          </div>
                        </div>
                        <span class="toggle">▶</span>
                      </div>
                      <div class="build-body">
                        <div class="cards">\${cards}</div>
                      </div>
                    </div>\`;
                }).join('');
              });
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Copy cross-runtime data + parity dashboard
        run: |
          mkdir -p site/cross-runtime
          # Snapshot atual (consumido por parity.html)
          if [ -f cross_runtime_report.json ]; then
            cp cross_runtime_report.json site/cross-runtime/report.json
          fi
          # Historico semanal
          if [ -d cross_runtime_history ]; then
            cp -r cross_runtime_history site/cross-runtime/history
          fi

          cat > site/parity.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>RTS — Cross-runtime parity (Bun/Node)</title>
            <style>
              :root {
                --bg: #0d1117; --fg: #e6edf3; --muted: #7d8590;
                --accent: #f78166; --card: #161b22; --border: #30363d;
                --link: #2f81f7; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                background: var(--bg); color: var(--fg); line-height: 1.6;
                min-height: 100vh; padding: 2rem 1rem;
              }
              .container { max-width: 1100px; margin: 0 auto; }
              header { margin-bottom: 2rem; }
              h1 {
                font-size: 2.5rem; font-weight: 700;
                background: linear-gradient(135deg, var(--accent), var(--link));
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                background-clip: text; margin-bottom: 0.5rem;
              }
              .tagline { color: var(--muted); font-size: 1rem; margin-bottom: 1rem; }
              nav a { color: var(--link); text-decoration: none; margin-right: 1rem; }
              nav a:hover { text-decoration: underline; }
              .big-pct {
                font-size: 5rem; font-weight: 700; color: var(--accent);
                line-height: 1; margin: 1rem 0;
              }
              .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
              .stat {
                background: var(--card); border: 1px solid var(--border);
                border-radius: 8px; padding: 1rem; text-align: center;
              }
              .stat .v { font-size: 1.8rem; font-weight: 600; }
              .stat .l { color: var(--muted); font-size: 0.85rem; }
              .pass { color: var(--ok); }
              .div { color: var(--warn); }
              .err { color: var(--bad); }
              h2 { font-size: 1.4rem; margin: 2rem 0 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
              #chart {
                background: var(--card); border: 1px solid var(--border);
                border-radius: 8px; padding: 1rem; margin-bottom: 2rem;
              }
              svg { width: 100%; height: 300px; }
              .axis text { fill: var(--muted); font-size: 11px; }
              .axis path, .axis line { stroke: var(--border); }
              .line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
              .dot { fill: var(--accent); }
              .grid { stroke: var(--border); stroke-dasharray: 2,2; opacity: 0.5; }
              table {
                width: 100%; border-collapse: collapse; margin-top: 1rem;
                background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
              }
              th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
              th { background: rgba(255,255,255,0.03); color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
              tr:last-child td { border-bottom: none; }
              td.fixture { font-family: 'SF Mono', monospace; font-size: 0.85rem; }
              .status-rts_diverge { color: var(--warn); }
              .status-rts_error { color: var(--bad); }
              footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); }
              footer a { color: var(--link); text-decoration: none; }
              .empty { text-align: center; padding: 3rem; color: var(--muted); }
            </style>
          </head>
          <body>
            <div class="container">
              <header>
                <h1>Cross-runtime parity</h1>
                <p class="tagline">RTS vs Bun vs Node — compatibilidade JS spec medida em fixtures TS standalone.</p>
                <nav><a href="index.html">← Builds</a><a href="https://github.com/UrubuCode/rts">GitHub →</a></nav>
              </header>
              <div id="content"><div class="empty">Carregando dados...</div></div>
              <footer>
                <p>Fonte: <code>cross_runtime_report.json</code> + <code>cross_runtime_history/</code> versionados em main. Atualizado automaticamente pelo workflow <a href="https://github.com/UrubuCode/rts/actions/workflows/cross-runtime.yml">Cross-Runtime Parity</a>.</p>
              </footer>
            </div>
            <script>
              const REPO = 'UrubuCode/rts';
              async function load() {
                try {
                  const [report, indexHist] = await Promise.all([
                    fetch('cross-runtime/report.json').then(r => r.json()),
                    fetch('cross-runtime/history/index.json').then(r => r.json()).catch(() => ({ entries: [] }))
                  ]);
                  render(report, indexHist);
                } catch (e) {
                  document.getElementById('content').innerHTML = '<div class="empty">Erro ao carregar: ' + e.message + '</div>';
                }
              }

              function render(report, indexHist) {
                const s = report.summary;
                const validBase = s.pass + s.rts_diverge + s.errors;
                const pct = validBase > 0 ? (s.pass / validBase * 100).toFixed(1) : 0;

                const failures = report.results.filter(r => r.status === 'rts_diverge' || r.status === 'rts_error');
                failures.sort((a, b) => a.name.localeCompare(b.name));

                const html = `
                  <div class="big-pct">${pct}%</div>
                  <div class="stats">
                    <div class="stat"><div class="v pass">${s.pass}</div><div class="l">✅ Pass</div></div>
                    <div class="stat"><div class="v div">${s.rts_diverge}</div><div class="l">❌ Diverge</div></div>
                    <div class="stat"><div class="v err">${s.errors}</div><div class="l">💥 Error</div></div>
                    <div class="stat"><div class="v">${s.total}</div><div class="l">📦 Total fixtures</div></div>
                  </div>

                  <h2>Evolução ao longo do tempo</h2>
                  <div id="chart">${indexHist.entries.length >= 2 ? '' : '<p style="color:var(--muted);padding:1rem;">Histórico ainda não disponível (menos de 2 snapshots).</p>'}</div>

                  <h2>${failures.length} fixtures pendentes</h2>
                  <table>
                    <thead><tr><th>Fixture</th><th>Status</th></tr></thead>
                    <tbody>
                      ${failures.map(f => `<tr><td class="fixture">${f.name}</td><td class="status-${f.status}">${f.status}</td></tr>`).join('')}
                    </tbody>
                  </table>
                `;
                document.getElementById('content').innerHTML = html;

                if (indexHist.entries.length >= 2) drawChart(indexHist.entries);
              }

              function drawChart(entries) {
                const W = 1000, H = 280, PAD = 40;
                const xs = entries.map((_, i) => i);
                const ys = entries.map(e => e.pct);
                const xMin = 0, xMax = entries.length - 1;
                const yMin = 0, yMax = 100;
                const xScale = (x) => PAD + (x - xMin) / (xMax - xMin || 1) * (W - 2 * PAD);
                const yScale = (y) => H - PAD - (y - yMin) / (yMax - yMin) * (H - 2 * PAD);
                const path = entries.map((e, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(e.pct)}`).join(' ');
                const dots = entries.map((e, i) => `<circle class="dot" cx="${xScale(i)}" cy="${yScale(e.pct)}" r="4"><title>${e.date}: ${e.pct}%</title></circle>`).join('');
                const yTicks = [0, 25, 50, 75, 100].map(v => `<line class="grid" x1="${PAD}" y1="${yScale(v)}" x2="${W - PAD}" y2="${yScale(v)}"/><text x="${PAD - 8}" y="${yScale(v) + 4}" text-anchor="end">${v}%</text>`).join('');
                const xTicks = entries.map((e, i) => i % Math.ceil(entries.length / 8) === 0 ? `<text x="${xScale(i)}" y="${H - PAD + 16}" text-anchor="middle">${e.date.slice(5)}</text>` : '').join('');
                document.getElementById('chart').innerHTML = `
                  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
                    <g class="axis">${yTicks}${xTicks}</g>
                    <path class="line" d="${path}"/>${dots}
                  </svg>
                `;
              }

              load();
            </script>
          </body>
          </html>
          HTMLEOF

          # Botao na index principal pra navegar
          if [ -f site/index.html ]; then
            sed -i 's|<a href="https://github.com/$REPO">GitHub →</a>|<a href="parity.html">Parity →</a><a href="https://github.com/$REPO">GitHub →</a>|' site/index.html || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
