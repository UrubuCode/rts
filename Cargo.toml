[workspace]
members = [
    ".",
    "crates/rts-linker",
    "crates/rts-dom",
    "crates/rts-input",
    "crates/rts-render",
    "crates/rts-egui",
    "crates/rts-macro",
    "crates/rts-cranelift",
    "crates/rts-codegen",
    "crates/rts-core",
    "crates/rts-ui",
    "crates/rts-std",
    "crates/rts-node",
    "crates/rts-host",
    "crates/rts-runtime",
    "crates/rts-napi-rwk",
    "crates/rts-cli",
]
resolver = "2"

# Declared once, inherited by every member with `license.workspace = true`.
# The LICENSE file at the root has always said MIT; until now no package
# metadata did, so every tool that reads a licence from Cargo — cargo-license,
# cargo-deny, crates.io, an SBOM generator, a downstream audit — saw nothing.
# The whole workspace is MIT, including the runtime that links into the binaries
# users compile. See THIRD-PARTY-NOTICES.md for what ships alongside it.
[workspace.package]
license = "MIT"

[package]
name = "rts"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "rts"
path = "src/main.rs"

# The `asio` feature (low-latency Windows audio, `asio_audio`) went with
# `rts-runtime`: it forwarded to that crate's own feature, and the namespace it
# enabled was the old runtime's. Nothing in this engine provides audio yet, so
# there is no feature to forward to — a flag that enables nothing is worse than
# an absent one, which is the rule `CLAUDE.md` states for `sync`.

[dependencies]
rts-linker = { path = "crates/rts-linker" }
# `rts-runtime` was on nobody's Cargo.toml — not even transitively — so a
# plain `cargo build` never produced `rts_runtime.lib`/`librts_runtime.a`
# and `rts compile` (new engine AOT) could not work from a fresh checkout.
# Direct dependency here for the same reason `rts-runtime` is listed here, per
# its own Cargo.toml comment: Cargo only emits a staticlib for a package built
# as a DIRECT target of the build, and being unreferenced (or merely a
# dependency-of-a-dependency) does not count.
rts-runtime = { path = "crates/rts-runtime" }
rts-cli = { path = "crates/rts-cli" }
anyhow = "1.0"
backtrace = "0.3"
sha2 = "0.10"
zstd = "0.13.3"

[build-dependencies]
sha2 = "0.10"
zstd = "0.13.3"

# ── DEV PROFILE: tuned for ITERATION, per the ITERATION SPEED mandatory rule ──
#
# MEASURED on this workspace (incremental rebuild after touching one file in
# rts-codegen, Windows/MSVC):
#
#   cargo check -p rts-codegen ...................... 1.8 s   <- the default loop
#   cargo build -p rts-cli, debug = 2 (stock) ....... 39.2 s
#   cargo build -p rts-cli, debug = 0 ............... see below
#
# Full debuginfo is the dominant cost of a debug LINK here — the engine pulls in
# wgpu/naga/egui/actix, and their debug info dwarfs their code. `debug = 0` drops
# line numbers from panics, which matters far less than it sounds: the crash
# handler (`src/crash.rs`) reads RUST_BACKTRACE and the interesting frames are in
# generated code anyway, which never had Rust line info. Turn it back up locally
# (`debug = 1`) when actually stepping through Rust.
[profile.dev]
debug = 0
incremental = true

[profile.release]
# `z` (optimize for SIZE) stays the DEFAULT: the bulk of the binary is wgpu /
# naga / egui / actix, none of which runs during a compile, and their size is
# what a standalone toolchain ships.
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# …but the COMPILE PATH is optimized for SPEED. These crates run on every single
# `rts run` / `rts compile` — the SWC parse, the HIR lowering, the engine's own
# lowering, and Cranelift itself — so building them for size taxes every
# invocation. Measured on an empty program (which still compiles the reachable
# prelude): parse+lower 65 -> 54 ms, machine-compile 32 -> 20 ms, whole startup
# 244 -> 190 ms (-22%), for +6 MB of binary when applied globally; scoping it to
# these packages keeps most of the win at a fraction of the size cost.
#
# Bare process startup (`rts --version`) is unchanged at ~78 ms either way, so
# this is not trading load time for run time — it is pure compile-path speed.
# The numbers above were measured against `rts-codegen-new`, which was the
# compile path when they were taken and has since been deleted. The three crates
# below are what a `rts run` now goes through, and they are listed for the same
# REASON — they run on every invocation — but the -22% is not re-measured and is
# not claimed for them.
[profile.release.package.rts-codegen]
opt-level = 3
[profile.release.package.rts-cranelift]
opt-level = 3
[profile.release.package.rts-core]
opt-level = 3
[profile.release.package.cranelift-codegen]
opt-level = 3
[profile.release.package.cranelift-frontend]
opt-level = 3
[profile.release.package.cranelift-jit]
opt-level = 3
[profile.release.package.cranelift-module]
opt-level = 3
[profile.release.package.regalloc2]
opt-level = 3
[profile.release.package.swc_ecma_parser]
opt-level = 3
[profile.release.package.swc_common]
opt-level = 3
[profile.release.package.swc_ecma_ast]
opt-level = 3



# Em DEBUG, não gerar debug symbols das DEPENDÊNCIAS (só do nosso código).
# Symbols de wgpu/naga/egui sozinhos incham a staticlib AOT de ~163MB para
# ~1GB — e você nunca depura dentro do wgpu. `debug=false` nas deps mantém o
# debug do código do RTS e corta ~900MB inúteis + acelera o build/zstd.
[profile.dev.package."*"]
debug = false
# `strip = "debuginfo"` remove o que sobrou de info de debug das deps no archive.
strip = "debuginfo"
# Dependencies get real optimization; workspace crates stay unoptimized. Deps are
# built ONCE and cached, so their compile cost is paid per clean build while their
# RUNTIME cost is paid on every `cargo run -- run file.ts`. An unoptimized
# wgpu/regex/swc is what makes a debug `rts run` unusable rather than merely slow
# — which matters now that `cargo run` is the sanctioned dev loop (ITERATION
# SPEED rule) instead of a release build.
opt-level = 2
