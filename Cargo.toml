[workspace]
members = [
    ".",
    "crates/rts-ast",
    "crates/rts-diagnostics",
    "crates/rts-abi",
    "crates/rts-engine",
    "crates/rts-node",
    "crates/rts-primitives",
    "crates/rts-shared",
    "crates/rts-std",
    "crates/rts-parser",
    "crates/rts-hir",
    "crates/rts-linker",
    "crates/rts-runtime",
    "crates/rts-napi",
    "crates/rts-dom",
    "crates/rts-input",
    "crates/rts-render",
    "crates/rts-egui",
    "crates/rts-adapters",
    "crates/rts-macro",
    "crates/rts-codegen-new",
    "crates/rts-prelude-baker",
    "crates/rts-symbol-baker",
    "crates/rts-cli",
]
resolver = "2"

[package]
name = "rts"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "rts"
path = "src/main.rs"

[features]
# Backend ASIO (Windows, baixa latência) no namespace `asio_audio`.
# Build com: cargo build --release --features asio
# Requer ASIO SDK da Steinberg + LLVM (LIBCLANG_PATH) + driver ASIO instalado.
asio = ["rts-runtime/asio"]

[dependencies]
rts-ast = { path = "crates/rts-ast" }
rts-diagnostics = { path = "crates/rts-diagnostics" }
rts-parser = { path = "crates/rts-parser" }
rts-linker = { path = "crates/rts-linker" }
rts-runtime = { path = "crates/rts-runtime" }
rts-cli = { path = "crates/rts-cli" }
anyhow = "1.0"
backtrace = "0.3"
object = { version = "0.39", default-features = false, features = ["write", "read", "std", "coff", "elf", "macho", "pe"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = true }
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
cranelift-object = "0.131"
rayon = "1.10"
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"
target-lexicon = "0.13"
colored = "2.1"
console = "0.15"
indicatif = "0.18"
xwin = "0.9"
swc_common = "21.0.1"
swc_ecma_ast = "23.0.0"
swc_ecma_parser = "39.0.0"
slotmap = "1"
rustc-hash = "1.1"
notify = "6.1"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
indexmap = "2.14.0"
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-rt = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
zstd = "0.13.3"

[build-dependencies]
sha2 = "0.10"
regex = "1"
rayon = "1.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.14.0"
actix-web = { version = "4", default-features = false, features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
zstd = "0.13.3"

# ── DEV PROFILE: tuned for ITERATION, per the ITERATION SPEED mandatory rule ──
#
# MEASURED on this workspace (incremental rebuild after touching one file in
# rts-codegen-new, Windows/MSVC):
#
#   cargo check -p rts-codegen-new .................. 1.8 s   <- the default loop
#   cargo build -p rts-cli, debug = 2 (stock) ....... 39.2 s
#   cargo build -p rts-cli, debug = 0 ............... see below
#
# Full debuginfo is the dominant cost of a debug LINK here — the engine pulls in
# wgpu/naga/egui/actix, and their debug info dwarfs their code. `debug = 0` drops
# line numbers from panics, which matters far less than it sounds: the crash
# handler (`src/crash.rs`) reads RUST_BACKTRACE and the interesting frames are in
# generated code anyway, which never had Rust line info. Turn it back up locally
# (`debug = 1`) when actually stepping through Rust.
[profile.dev]
debug = 0
incremental = true

[profile.release]
# `z` (optimize for SIZE) stays the DEFAULT: the bulk of the binary is wgpu /
# naga / egui / actix, none of which runs during a compile, and their size is
# what a standalone toolchain ships.
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# …but the COMPILE PATH is optimized for SPEED. These crates run on every single
# `rts run` / `rts compile` — the SWC parse, the HIR lowering, the engine's own
# lowering, and Cranelift itself — so building them for size taxes every
# invocation. Measured on an empty program (which still compiles the reachable
# prelude): parse+lower 65 -> 54 ms, machine-compile 32 -> 20 ms, whole startup
# 244 -> 190 ms (-22%), for +6 MB of binary when applied globally; scoping it to
# these packages keeps most of the win at a fraction of the size cost.
#
# Bare process startup (`rts --version`) is unchanged at ~78 ms either way, so
# this is not trading load time for run time — it is pure compile-path speed.
[profile.release.package.rts-codegen-new]
opt-level = 3
# The prelude baker runs the full compile path (SWC + lowering + Cranelift) once
# at build time — speed matters, like every other compile-path package.
[profile.release.package.rts-prelude-baker]
opt-level = 3
[profile.release.package.rts-adapters]
opt-level = 3
[profile.release.package.rts-parser]
opt-level = 3
[profile.release.package.rts-hir]
opt-level = 3
[profile.release.package.rts-engine]
opt-level = 3
[profile.release.package.cranelift-codegen]
opt-level = 3
[profile.release.package.cranelift-frontend]
opt-level = 3
[profile.release.package.cranelift-jit]
opt-level = 3
[profile.release.package.cranelift-module]
opt-level = 3
[profile.release.package.regalloc2]
opt-level = 3
[profile.release.package.swc_ecma_parser]
opt-level = 3
[profile.release.package.swc_common]
opt-level = 3
[profile.release.package.swc_ecma_ast]
opt-level = 3

# The RUNTIME layer is opt-3 for a different reason: this is the code the
# COMPILED PROGRAM calls at run time (string ops, collections, math, the value
# model's trampolines). Building it for size taxes the user's program, not the
# compiler — and "faster than Bun by default" is measured on exactly that path.
[profile.release.package.rts-primitives]
opt-level = 3
[profile.release.package.rts-shared]
opt-level = 3
[profile.release.package.rts-std]
opt-level = 3
[profile.release.package.rts-runtime]
opt-level = 3

# Em DEBUG, não gerar debug symbols das DEPENDÊNCIAS (só do nosso código).
# Symbols de wgpu/naga/egui sozinhos incham a staticlib AOT de ~163MB para
# ~1GB — e você nunca depura dentro do wgpu. `debug=false` nas deps mantém o
# debug do código do RTS e corta ~900MB inúteis + acelera o build/zstd.
[profile.dev.package."*"]
debug = false
# `strip = "debuginfo"` remove o que sobrou de info de debug das deps no archive.
strip = "debuginfo"
# Dependencies get real optimization; workspace crates stay unoptimized. Deps are
# built ONCE and cached, so their compile cost is paid per clean build while their
# RUNTIME cost is paid on every `cargo run -- run file.ts`. An unoptimized
# wgpu/regex/swc is what makes a debug `rts run` unusable rather than merely slow
# — which matters now that `cargo run` is the sanctioned dev loop (ITERATION
# SPEED rule) instead of a release build.
opt-level = 2
