[workspace]
members = [
    ".",
    "crates/rts-ast",
    "crates/rts-diagnostics",
    "crates/rts-engine",
    "crates/rts-node",
    "crates/rts-primitives",
    "crates/rts-shared",
    "crates/rts-std",
    "crates/rts-parser",
    "crates/rts-hir",
    "crates/rts-linker",
    "crates/rts-runtime",
    "crates/rts-napi",
    "crates/rts-codegen-new",
    "crates/rts-cli",
]
resolver = "2"

[package]
name = "rts"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "rts"
path = "src/main.rs"

[features]
# Backend ASIO (Windows, baixa latência) no namespace `asio_audio`.
# Build com: cargo build --release --features asio
# Requer ASIO SDK da Steinberg + LLVM (LIBCLANG_PATH) + driver ASIO instalado.
asio = ["rts-runtime/asio"]

[dependencies]
rts-ast = { path = "crates/rts-ast" }
rts-diagnostics = { path = "crates/rts-diagnostics" }
rts-parser = { path = "crates/rts-parser" }
rts-linker = { path = "crates/rts-linker" }
rts-runtime = { path = "crates/rts-runtime" }
rts-cli = { path = "crates/rts-cli" }
anyhow = "1.0"
backtrace = "0.3"
object = { version = "0.39", default-features = false, features = ["write", "read", "std", "coff", "elf", "macho", "pe"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = true }
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
cranelift-object = "0.131"
rayon = "1.10"
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"
target-lexicon = "0.13"
colored = "2.1"
console = "0.15"
indicatif = "0.18"
xwin = "0.9"
swc_common = "21.0.1"
swc_ecma_ast = "23.0.0"
swc_ecma_parser = "39.0.0"
slotmap = "1"
rustc-hash = "1.1"
notify = "6.1"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
indexmap = "2.14.0"
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-rt = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
zstd = "0.13.3"

[build-dependencies]
sha2 = "0.10"
regex = "1"
rayon = "1.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.14.0"
actix-web = { version = "4", default-features = false, features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
zstd = "0.13.3"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
