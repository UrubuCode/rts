[package]
name = "rts-engine"
version = "0.1.0"
edition = "2024"

# rts-engine — o núcleo cru do RTS: o vocabulário ABI (`abi`, antes o crate
# `rts-abi`) + o registry + o builder que o codegen consome. As camadas
# (rts-std, rts-node, rts-browser) registram a sua superfície aqui via o builder.
# Substitui o modelo de const-tables + proc-macro (rts-macro).
[dependencies]
# O heap GC tipado (Entry/HandleTable) migrou pro motor (Fase 1a da partição).
# Os payloads do Entry puxam estas libs — TEMP até a Fase 2 (Entry::Backend(dyn
# Traceable) devolve os payloads backend pro rts-std e limpa rustls daqui).
# Cranelift — um membro do Registry pode declarar um EMITTER nativo (ver
# `member::NativeEmit`) que emite IR direto em vez de `call <symbol>`. Isso põe a
# emissão junto do spec, não dentro do motor, e é o que permite tratar as ops
# escalares como primitivas de verdade. Cranelift é Rust puro (sem deps C), logo
# não quebra alvo nenhum — a camada universal continua compilando para wasm.
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
# Minimal pure-Rust block_on executor — the `#[rtse::asynch]` bridge drives a
# real Rust `async fn` body to completion synchronously (interim engine async is
# synchronous). Pure, no C deps, no tokio — keeps the universal layer wasm-safe.
pollster = "0.3"
indexmap = "2.14.0"
regex = "1"
fancy-regex = "0.13"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
