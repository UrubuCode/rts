[package]
name = "rts-engine"
version = "0.1.0"
edition = "2024"

# rts-engine — o núcleo cru do RTS: o vocabulário ABI (`abi`, antes o crate
# `rts-abi`) + o registry + o builder que o codegen consome. As camadas
# (rts-std, rts-node, rts-browser) registram a sua superfície aqui via o builder.
# Substitui o modelo de const-tables + proc-macro (rts-macro).
[dependencies]
# The ABI contract, extracted into its own crate (see rts-abi/Cargo.toml).
# rts-engine re-exports it as `abi` so existing `rts_engine::abi::X` paths hold.
rts-abi = { path = "../rts-abi" }
# The `#[rtse::*]` authoring macros. `rts-macro` does NOT depend on this crate
# (it only EMITS `::rts_engine::*` paths inside `quote!`, which is not a
# dependency), so this edge is acyclic — the stray dep that used to make it look
# cyclic was removed with this change.
rtse = { package = "rts-macro", path = "../rts-macro" }
# HOW IT WORKS INSIDE — the heap/HandleTable/shapes/NaN-box + the GC, moved OUT
# of this crate (RTS_ORGANIZATION.md N1/N2). The engine MANAGES; it does not own
# the value representation. Re-exported verbatim from `lib.rs` (`heap`,
# `collector`, `numfmt`) so every `rts_engine::heap::…` path above still
# resolves. This edge is the direction the crate already wanted: it used to fake
# it with `extern "C"` forward declarations pointing at code that lived above.
#
# Note what LEFT with it: regex / fancy-regex / serde_json / sha2 / rustls /
# indexmap were `Entry`-payload dependencies, and measurement showed the
# dispatch half (registry/builder/member/sig) used none of them. A crate that
# only decides dispatch has no business linking a TLS stack.
rts-natives = { path = "../rts-natives" }
# Cranelift — um membro do Registry pode declarar um EMITTER nativo (ver
# `member::NativeEmit`) que emite IR direto em vez de `call <symbol>`. Isso põe a
# emissão junto do spec, não dentro do motor, e é o que permite tratar as ops
# escalares como primitivas de verdade. Cranelift é Rust puro (sem deps C), logo
# não quebra alvo nenhum — a camada universal continua compilando para wasm.
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
# Minimal pure-Rust block_on executor — the `#[rtse::asynch]` bridge drives a
# real Rust `async fn` body to completion synchronously (interim engine async is
# synchronous). Pure, no C deps, no tokio — keeps the universal layer wasm-safe.
pollster = "0.3"
