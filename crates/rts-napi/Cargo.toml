[package]
name = "rts-napi"
version = "0.1.0"
edition = "2024"
license.workspace = true

# This carried an `-rwk` suffix while the old engine's N-API crate still stood
# beside it as the reference being read from — cargo will not have two crates
# under one name. The suffix went on 2026-08-10 with the crate that forced it,
# once the symbol sets matched: 145 names there, 146 here, nothing missing.
# A phase is finished when the old code is gone, and this one is.

[dependencies]
rts-core = { path = "../rts-core" }
