[package]
name = "rts-codegen"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The language layer: JavaScript and TypeScript semantics, lowered onto the machine."

[lib]
crate-type = ["rlib"]

[dependencies]
# The machine, and nothing else. Not Cranelift — reaching it directly is the
# failure this pair of crates exists to prevent, and a dependency edge is where
# that failure would start.
rts-cranelift = { path = "../rts-cranelift" }

# The parser bridge. SWC is the front end for both trees: rts-parser already
# lowers its output into the old AST, and `parse/` lowers the same output into
# this one. Reusing it is also what gives us ASI — which decides what parses,
# and so is not something a language layer may skip.
swc_common = "21.0.1"
swc_ecma_ast = "23.0.0"
swc_ecma_parser = "39.0.0"

[dev-dependencies]
# The integration tests build trees that carry machine positions, so they name
# the machine directly rather than through a re-export. A re-export would make
# this crate part of the machine's public surface, which it is not.
rts-cranelift = { path = "../rts-cranelift" }
