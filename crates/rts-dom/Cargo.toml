[package]
name = "rts-dom"
version = "0.1.0"
edition = "2024"
license.workspace = true

# DOM retido (árvore de elementos HTML) — estrutura de dados PURA, independente de
# render/janela. Parser HTML mínimo (tokenizer + árvore em arena), NodeId
# versionado {gen,idx}, query por tag/#id/.classe (índices O(1)), mutação.
#
# DOUTRINA: este crate NÃO conhece egui/winit/wgpu nem nenhum backend de UI. Ele
# expõe PRIMITIVOS via ABI de handles u64 (extern "C") através de `register`; o
# `rts-egui` (e qualquer outro consumidor) leem a árvore. A camada de alto nível
# (Document/Element ergonômico) vive em TS. Ver docs/ui/dom-crate.md.
#
# Depende SÓ de rts-engine (Engine/Registry/AbiType + HandleTable), como rts-egui,
# e de `flate2` (abaixo) para descodificar PNG — a única leitura de BYTES JÁ EM
# MEMÓRIA que o crate faz. wasm-safe (sem I/O, sem threads de plataforma): o
# módulo `imagem` não lê ficheiro nenhum por desenho, ver o seu cabeçalho.

[dependencies]
# O `inflate` do PNG de `src/imagem/png.rs` (lote imagens-no-raster, movido de
# `rts-dom-bridge`, que trazia esta MESMA linha desde o lote V-img). Mesmo pin
# do `rts-std` (`docs/reference/node/crates.md` §4.4): backend puro Rust, sem C.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# Ver a nota igual em rts-render/rts-input: a ABI do motor ANTIGO é uma feature.
# Sem ela sobram a árvore, o parser, o estilo e o LAYOUT — que é a maior parte
# deste crate e não conhece motor nenhum.
[features]
# `metrics`: liga os contadores de `src/metrics.rs` (cascade/layout/invalidação).
# Desligada por padrão porque instrumentação em caminho quente distorce o tempo —
# um número de relógio medido COM ela não é comparável a um sem. Ligue para
# responder ONDE o trabalho acontece; desligue para medir QUANTO ele custa.
metrics = []
