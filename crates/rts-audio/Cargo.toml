[package]
name = "rts-audio"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "`rts:audio` — a saída de som (cpal ou nula), o kernel de mixagem e o decodificador OGG/Vorbis."

# Crate próprio pela razão que `docs/engine/architecture.md` aceita para uma
# fronteira: DISPONIBILIDADE. Um dispositivo de som não existe em wasm, e um
# alvo sem ele não deve carregar cpal no grafo. Mesmo argumento de `rts-physics`.

[dependencies]
# OGG/Vorbis em Rust puro, sem C (spec 2026-09-27 §3.1, decisão do usuário).
lewton = "0.10"
