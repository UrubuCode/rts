[package]
name = "rts-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Where a compiler and a runtime meet: the crate that runs a program."

[dev-dependencies]
rts-std = { path = "../rts-std" }

[dependencies]
# The language: source text to IR.
rts-codegen = { path = "../rts-codegen" }

# The machine: IR to code, and the two destinations.
#
# NOT cranelift-* — rts-cranelift's rule 1 is "no other crate in the workspace
# may depend on cranelift-*", and this crate is not an exception to it. The
# first version of this manifest named cranelift-module and cranelift-jit and
# claimed the permission in its own README, which was an invention.
#
# The reason it seemed necessary is recorded in PLAN.md: the machine's placement
# API took `cranelift_module::Linkage` and handed back a `JITModule`, so
# obeying the rule was impossible. That was fixed where it belonged, in the
# machine, rather than worked around here.
rts-cranelift = { path = "../rts-cranelift" }

# The runtime: what a compiled program calls out to.
rts-core = { path = "../rts-core" }
rts-std = { path = "../rts-std" }
rts-node = { path = "../rts-node" }
# `rts:rigid`: um solver de corpos rígidos paralelo. Opcional pela mesma regra
# de DISPONIBILIDADE que a UI: `rayon` são threads do SO, que wasm não tem, e um
# alvo que nunca simula nada não deve carregar um pool de threads no grafo.
#
# Dentro do default, ao contrário da UI, porque não arrasta o débito do motor
# antigo que mantém `ui` fora dele — `rts-physics` depende de `rts-core` e de
# `rayon`, e de mais nada.
rts-physics = { path = "../rts-physics", optional = true }
# A UI: `rts:egui` e `rts:input`. Opcional porque uma janela é uma questão de
# DISPONIBILIDADE — não existe em wasm nem num build headless — e um alvo sem
# ela não deve carregar wgpu/winit no grafo para descobrir isso.
rts-ui = { path = "../rts-ui", optional = true }

[features]
# `ui` E PADRAO. A razao de ela ter ficado de fora morreu com o crate que a
# causava, e o comentario que estava aqui citava esse crate por nome.
#
# O texto anterior dizia: `rts-natives` deixa dois simbolos indefinidos
# (`__RTS_FN_GL_FUNCTION_CALL`, `__RTS_FN_GL_RANGE_ERROR_NEW`) que so o binario
# do motor antigo resolve, e um build de workspace UNIFICA features por pacote —
# entao um host que dependesse de `rts-ui` por default arrastaria `rts-natives`
# para os proprios testes. Foi medido na epoca: `cargo build --workspace --tests`
# passava de 18 alvos quebrados para 27.
#
# `rts-natives` foi DELETADO em 2026-08-10, com o resto do motor antigo. Ele
# aparecia duas vezes neste arquivo e zero vezes em `crates/` — o motivo existia
# so no comentario que o descrevia.
#
# MEDIDO DE NOVO, antes e depois desta mudanca, `cargo build --workspace --tests`,
# contando ALVOS que nao compilam e nao linhas de erro:
#
#   antes   3   rts-codegen (lib test), rts-codegen (test "language"), rts-runtime
#   depois  2   rts-codegen (test "language"), rts-runtime
#
# Os que restam sao os mesmos e sao anteriores: campo `claim` faltando num
# inicializador de `syntax::Field`, alguem acrescentou o campo e nao atualizou o
# teste. NENHUM alvo quebrou por causa da UI, e o numero nao subiu — que era a
# unica coisa que o texto anterior previa que aconteceria.
#
# O QUE ISTO CUSTA, dito em vez de escondido: todo build do workspace passa a
# linkar `wgpu` e `winit`, inclusive os headless — a suite, o `run_fixture`, o
# cross-runtime. Num alvo sem tela isso e peso morto, e num alvo que nao TEM
# janela (wasm) e um erro de link. Quando esse alvo existir, a feature volta a
# ser opcional e o motivo sera este, medido, e nao um crate que ja nao existe.
default = ["physics", "ui"]
ui = ["dep:rts-ui"]
physics = ["dep:rts-physics"]

# Os dois alvos que só existem com a UI. Sem isto um `cargo test -p rts-host`
# tentaria compilá-los sem o crate e falharia por nome não resolvido, que é uma
# mensagem sobre a causa errada.
[[test]]
name = "ui_surface"
required-features = ["ui"]

[[example]]
name = "janela"
required-features = ["ui"]

[[example]]
name = "gpu"
required-features = ["ui"]

[[example]]
name = "ui_fixture"
required-features = ["ui"]
