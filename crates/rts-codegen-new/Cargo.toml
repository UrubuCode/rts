[package]
name = "rts-codegen-new"
version = "0.1.0"
edition = "2024"

# rts-codegen-new — the lean redesign. See docs/specs/rts-codegen-new-design.md.
# Thesis: prove-monomorphic-and-unbox where the type system can; fall to ONE
# honest in-value tagged representation (PolyValue, NaN-box) + hidden-class
# shapes + AOT-safe data inline-caches where it can't. No second optimizer tier
# (Cranelift's egraph is the sole optimizer). No builtins in the engine — only
# PRIMORDIAL classes are named; everything else resolves via the Registry.

[dependencies]
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
cranelift-module = "0.131"
anyhow = "1.0"
# Increment 3: parse REAL TypeScript and lower its typed HIR straight to
# Cranelift for the proven-monomorphic numeric subset. rts-parser gives the swc
# parse + internal AST; rts-hir gives the typed HirFunc we lower. Consumed
# read-only — the new engine never reaches into the old codegen.
rts-parser = { path = "../rts-parser" }
rts-hir = { path = "../rts-hir" }
rts-ast = { path = "../rts-ast" }
# The P1 proof harness (lower/jit.rs) builds and finalizes a real JITModule and
# installs the REAL runtime __RTS_FN_* extern symbols into it, so the JIT +
# host-ISA builders are regular (non-test) dependencies now, not dev-only.
cranelift-jit = "0.131"
cranelift-native = "0.131"
# The REAL runtime. This is the layering fix: codegen no longer ships a fake
# in-crate mini-runtime — it calls the real rts-engine/rts-primitives/rts-shared/
# rts-std surface through this thin facade. The facade transitively pulls those
# four crates and re-exports the `__RTS_FN_*` extern "C" impls under
# `rts_runtime::namespaces::*` (io, collections::vec, gc::string_pool); we consume
# them strictly as-is. Do NOT depend on rts-engine/rts-primitives directly — they
# come via this facade — and never on rts-codegen-old (the old engine is frozen).
rts-runtime = { path = "../rts-runtime" }

[dev-dependencies]
target-lexicon = "0.13"
