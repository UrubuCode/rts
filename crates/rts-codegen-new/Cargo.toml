[package]
name = "rts-codegen-new"
version = "0.1.0"
edition = "2024"

# rts-codegen-new — the lean redesign. See docs/specs/rts-codegen-new-design.md.
# Thesis: prove-monomorphic-and-unbox where the type system can; fall to ONE
# honest in-value tagged representation (PolyValue, NaN-box) + hidden-class
# shapes + AOT-safe data inline-caches where it can't. No second optimizer tier
# (Cranelift's egraph is the sole optimizer). No builtins in the engine — only
# PRIMORDIAL classes are named; everything else resolves via the Registry.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
# `enable-serde` so the resident-prelude baker (slice 2) can serialize captured
# `Reloc`/`LibCall` reloc kinds into the manifest (targets are symbolized to names
# by us; only the kind enums come from cranelift).
cranelift-codegen = { version = "0.131", features = ["enable-serde"] }
cranelift-frontend = "0.131"
cranelift-module = "0.131"
cranelift-object = "0.131"
anyhow = "1.0"
# Increment 3: parse REAL TypeScript and lower its typed HIR straight to
# Cranelift for the proven-monomorphic numeric subset. rts-parser gives the swc
# parse + internal AST; rts-hir gives the typed HirFunc we lower. Consumed
# read-only — the new engine never reaches into the old codegen.
rts-parser = { path = "../rts-parser" }
rts-hir = { path = "../rts-hir" }
rts-ast = { path = "../rts-ast", features = ["serde"] }
# Template literals + optional chaining (P5.8): rts-hir lowers swc `Tpl` and
# `OptChainExpr` to a structureless `HirExprKind::Raw` (it cannot model them yet
# and we must not modify that crate). The P5.8 desugar pass re-walks the REAL swc
# AST (re-parsed via rts-parser) to recover their structure, so it needs the swc
# AST node types directly. Consumed read-only, same version rts-hir pins.
# `swc_ecma_visit` gives a canonical depth-first walk so the P5.8 collector visits
# `Tpl`/`OptChainExpr` nodes in source order without a hand-rolled (drift-prone)
# Expr visitor.
swc_ecma_ast = "23.0.0"
swc_ecma_visit = "23.0.0"
# The P1 proof harness (lower/jit.rs) builds and finalizes a real JITModule and
# installs the REAL runtime __RTS_FN_* extern symbols into it, so the JIT +
# host-ISA builders are regular (non-test) dependencies now, not dev-only.
cranelift-jit = "0.131"
cranelift-native = "0.131"
# The REAL runtime. This is the layering fix: codegen no longer ships a fake
# in-crate mini-runtime — it calls the real rts-engine/rts-primitives/rts-shared/
# rts-std surface through this thin facade. The facade transitively pulls those
# four crates and re-exports the `__RTS_FN_*` extern "C" impls under
# `rts_runtime::namespaces::*` (io, collections::vec, gc::string_pool); we consume
# them strictly as-is. It stays the DEFAULT route to the runtime — one import
# path for the bulk of the surface — but it is no longer a wall.
rts-runtime = { path = "../rts-runtime" }
# Pilar 6 (data-driven dispatch via the Registry). The real
# `rts_engine::Engine`/`Registry`, so RUNTIME/Registry classes (Date/Map/Set/
# RegExp/Error/wrappers) resolve their `(symbol, AbiTypes)` from the SAME
# Registry the real runtime publishes, instead of a hand-written per-class
# metadata table in codegen.
#
# DEPENDENCY-DIRECTION BAN LIFTED (owner decision, 2026-07-28). The old rule
# ("reach the runtime ONLY through the facade, never a second direct dep") is
# GONE, for both this crate and the workspace generally. It was the stated
# justification for three parallel hand-written tables — `adapter_symbols/
# list_*.rs`, `value/abi_sig.rs`, `rts-runtime/src/adapters/dispatch.rs`, 527
# rows measured — each existing only because the crate that needed the metadata
# was forbidden from reaching the crate that owned it. The single source of
# truth is `rts-macro` (declares + types every symbol) and `rts-symbol-baker`
# (bakes the ordered table the JIT vtable and the AOT symbol set both read); a
# dependency edge that reaches them is CORRECT, and a hand-typed mirror is the
# regression. See docs/specs/rts-macro-single-source.md.
#
# Still binding, and a SEPARATE rule: the engine names ONLY the PRIMORDIAL
# classes in its control flow. A dependency edge is allowed; hardcoding
# `Map`/`Date`/`URL`/… in codegen is not.
rts-engine = { path = "../rts-engine" }
# The runtime-side value model (PolyValue + the `__rtsadp_*` trampolines) used
# to live in its own Cranelift-free crate (`rts-adapters`); it is now
# `rts_runtime::adapters` (`crates/rts-runtime/src/adapters/`), reached through
# the `rts-runtime` dependency above — no separate crate needed. This crate
# keeps only the Cranelift *emit* side (value::emit/…).
# `rtse::sym!(Type::member)` — resolves a call site's symbol to the
# macro-derived `SymbolDesc` const `#[rtse::class]` emitted on `Type`, instead
# of a hand-typed string literal (docs/specs/rts-macro-single-source.md). This
# is the proc-macro crate itself (no runtime surface, purely compile-time), not
# a second route to rts-engine/rts-primitives — the const it resolves is still
# reached through a type reachable via the `rts-runtime` facade.
rtse = { package = "rts-macro", path = "../rts-macro" }
# Per-function Cranelift compilation is independent work; `parcompile` runs it
# across cores between the (serial) IR build and the (serial) module define.
rayon = "1.10"

[dev-dependencies]
target-lexicon = "0.13"
