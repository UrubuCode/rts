[package]
name = "rts-node"
version = "0.1.0"
edition = "2024"

[dependencies]
rts-engine = { path = "../rts-engine" }
# CSPRNG for node:crypto.randomUUID / randomFillSync — pure-Rust OS entropy
# (BCryptGenRandom / getrandom syscall), no C. See docs/node-implementation/crates.md.
getrandom = "0.2"
# node:string_decoder — Entry::Map instance storage (IndexMap<String,i64>), the
# same object-backed class model DOMException uses. Already a workspace dep.
indexmap = "2"
# node:url — real UTS-46 IDNA for domainToASCII/domainToUnicode (pure Rust,
# permissive, already a workspace dep via the WHATWG URL impl).
idna = "1"
# node:zlib — pure-Rust compression (flate2/miniz_oxide backend = no C; brotli is
# pure Rust). Permissive (MIT/Apache-2.0). See docs/node-implementation/crates.md.
flate2 = "1"
brotli = "8"
# node:crypto — pure-Rust hashing (RustCrypto: md-5/sha1/sha2 + the DynDigest
# trait for runtime-selected algorithms). MIT/Apache-2.0, no C. HMAC is built
# manually over DynDigest (ipad/opad), so no generic hmac crate is needed. See
# docs/node-implementation/crates.md.
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
ripemd = "0.1"
# node:crypto.scryptSync — RFC 7914 scrypt KDF (RustCrypto, pure Rust, no C).
scrypt = { version = "0.11", default-features = false }
# node:crypto Cipheriv/Decipheriv — AES-256-GCM (AEAD) and AES-256/128-CBC
# (RustCrypto `aes`/`aes-gcm`/`cbc`, pure Rust, MIT/Apache-2.0, no C).
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
# node:crypto Diffie-Hellman over Curve25519 (X25519) — needed by Signal-protocol
# style key exchange (RustCrypto `x25519-dalek`, pure Rust, MIT/Apache-2.0, no C).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# node:fs.globSync — filesystem glob pattern matching (pure Rust, MIT/Apache-2.0,
# no C). See docs/node-implementation/crates.md.
glob = "0.3"
# node:fs.watch — OS filesystem notifications (inotify/kqueue/ReadDirectoryChangesW
# via pure-Rust bindings, no C compile). Permissive (CC0-1.0 / Artistic-2.0).
notify = "6"
# node:dgram — the UDP socket surface. `socket2` is a strict superset of
# std::net::UdpSocket: it exposes the socket options Node's dgram needs (buffer
# sizes, multicast join/leave incl. IPv4 source-specific, TTL/hops, loopback,
# interface selection, SO_REUSEADDR/SO_REUSEPORT, IPV6_V6ONLY) over ONE type.
# MIT/Apache-2.0, pure Rust over libc/windows-sys FFI declarations — no C
# compile. See docs/node-implementation/{crates.md §2, dgram.md §5.1}.
socket2 = { version = "0.6", features = ["all"] }

# node:os — POSIX syscall surface (uname/gethostname/sysinfo/getloadavg/
# getpriority/getpwuid_r/getifaddrs). libc is FFI-only, no C compile — permissive
# (MIT/Apache-2.0). Windows uses hand-declared `extern "system"` (kernel32/ntdll,
# repo idiom, no windows-sys dep). See docs/node-implementation/crates.md.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
