[package]
name = "rts-node"
version = "0.1.0"
edition = "2024"

[dependencies]
rts-engine = { path = "../rts-engine" }
# CSPRNG for node:crypto.randomUUID / randomFillSync — pure-Rust OS entropy
# (BCryptGenRandom / getrandom syscall), no C. See docs/node-implementation/crates.md.
getrandom = "0.2"
