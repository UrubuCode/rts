[package]
name = "rts-cranelift"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The machine layer: a language-agnostic IR, verifier and code generator over Cranelift."

[lib]
crate-type = ["rlib"]

[dependencies]
# The code generator, reachable only from `lower/`. Every other module in this
# crate — and every other crate in the workspace — manipulates this crate's own
# representation instead. That is the invariant the whole layer rests on, and it
# is why these dependencies appear only now, with the module that needs them.
# A fast hash for tables keyed by this crate's OWN numbers.
#
# The shape tree's maps are keyed by `ShapeId`, `Key` and `Repr` — integers this
# crate mints itself, never anything a program supplies — so there is no
# adversary to be resistant to, and `std`'s SipHash is buying nothing on them.
# rustc measured 4-84% from exactly this swap.
#
# Apache-2.0 OR MIT, already in the tree transitively, pure Rust over no
# operating system, and it decides nothing this layer decides.
rustc-hash = "2"

cranelift-codegen = "0.131"
cranelift-frontend = "0.131"

# The module layer and the two destinations, reachable only from `target/`.
cranelift-module = "0.131"
cranelift-native = "0.131"
cranelift-jit = "0.131"
cranelift-object = "0.131"
anyhow = "1.0"

# The parallel machine-compile phase in `target/` — `Context::compile` run
# across a pool, never `lower/`'s IR construction (see `target/mod.rs`'s
# `MachineModule::prepare` doc for why that half must stay serial).
rayon = "1.10"

[dev-dependencies]
# Reading back what `place_in_object` produced, to check an undefined symbol
# is really in it — the same crate `cranelift-object` already writes with.
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "coff", "macho", "std"] }
