[package]
name = "rts-cranelift"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The machine layer: a language-agnostic IR, verifier and code generator over Cranelift."

[lib]
crate-type = ["rlib"]

[dependencies]
# The code generator, reachable only from `lower/`. Every other module in this
# crate — and every other crate in the workspace — manipulates this crate's own
# representation instead. That is the invariant the whole layer rests on, and it
# is why these dependencies appear only now, with the module that needs them.
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"

# The module layer and the two destinations, reachable only from `target/`.
cranelift-module = "0.131"
cranelift-native = "0.131"
cranelift-jit = "0.131"
cranelift-object = "0.131"
anyhow = "1.0"
