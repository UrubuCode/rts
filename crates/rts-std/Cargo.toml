[package]
name = "rts-std"
version = "0.1.0"
edition = "2024"

# rts-std — camada BACKEND (rts app): namespaces de plataforma (I/O, net, process,
# áudio, ...). Depende do motor (rts-engine, que detém o heap GC). Ver
# .claude/plans/partitioned-meandering-milner.md.

[features]
# Backend ASIO (Windows, baixa latência) no namespace `asio_audio`.
asio = ["cpal/asio"]

[dependencies]
rts-engine = { path = "../rts-engine" }
# Primordiais (Fase 2): collector/stack.rs cria Error via rts_primitives::error.
rts-primitives = { path = "../rts-primitives" }
rts-shared = { path = "../rts-shared" }
indexmap = "2.14.0"
rayon = "1.10"
sha2 = "0.10"
flate2 = "1.1"
ureq = { version = "2.12", default-features = true }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-rt = "2"
cpal = "0.18"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
