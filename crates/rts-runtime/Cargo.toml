[package]
name = "rts-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
rts-abi = { path = "../rts-abi" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: JS spec ECMA-262 OrdinaryOwnPropertyKeys exige ordem de
# insercao para string keys. Sem isso, JSON.parse(...) seguido de Object.keys
# retornava ordem alfabetica em vez da ordem do JSON source.
serde_json = { version = "1.0", features = ["preserve_order"] }
json5 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
rayon = "1.10"
sha2 = "0.10"
regex = "1"
fancy-regex = "0.13"
unicode-normalization = "0.1"
rustls = { version = "0.23", default-features = false, features = [
    "std", "ring", "tls12"
] }
webpki-roots = "1"
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-rt = "2"
fltk = { version = "1", features = ["fltk-bundled"] }
indexmap = "2.14.0"
colored = "2.1"
notify = "6.1"
flate2 = "1.1"
tar = "0.4"
ureq = { version = "2.12", default-features = true }
slotmap = "1"
rustc-hash = "1.1"
time = { version = "0.3", features = ["local-offset"] }
# (#1281) Invocacao dinamica de fn_ptr com aridade/tipos arbitrarios,
# abstraindo a ABI de chamada de cada plataforma (Win64/SysV/AArch64). Usado
# em invoke_typed/invoke_all_i64 (trampolins de curry / callbacks dinamicos)
# no lugar de asm inline por-plataforma.
libffi = "3.2"
