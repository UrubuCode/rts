[package]
name = "rts-runtime"
version = "0.1.0"
edition = "2024"

# rlib: linked into the `rts` bin for the JIT path.
# staticlib: cargo bundles all deps + the __RTS_* extern "C" symbols into one
#   archive (librts_runtime.a / rts_runtime.lib) that the AOT linker pulls in.
#   This replaces the fragile hand-rolled rustc invocation in build.rs that
#   could not reliably disambiguate duplicate dependency rlib variants on CI.
[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Habilita o backend ASIO (Windows, baixa latência) no namespace `asio_audio`.
# Off por padrão: exige o ASIO SDK da Steinberg + LLVM/libclang no build, e o
# código `asio_audio` só é compilado quando esta feature está ativa.
# Ative com: cargo build --features rts-runtime/asio  (ou -p rts-runtime --features asio)
asio = ["cpal/asio"]

[dependencies]
rts-engine = { path = "../rts-engine" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: JS spec ECMA-262 OrdinaryOwnPropertyKeys exige ordem de
# insercao para string keys. Sem isso, JSON.parse(...) seguido de Object.keys
# retornava ordem alfabetica em vez da ordem do JSON source.
serde_json = { version = "1.0", features = ["preserve_order"] }
json5 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
rayon = "1.10"
sha2 = "0.10"
regex = "1"
fancy-regex = "0.13"
unicode-normalization = "0.1"
rustls = { version = "0.23", default-features = false, features = [
    "std", "ring", "tls12"
] }
webpki-roots = "1"
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-rt = "2"
indexmap = "2.14.0"
colored = "2.1"
notify = "6.1"
flate2 = "1.1"
tar = "0.4"
ureq = { version = "2.12", default-features = true }
slotmap = "1"
rustc-hash = "1.1"
time = { version = "0.3", features = ["local-offset"] }
# audio namespace — low-level device I/O. Default backend is pure Rust
# (WASAPI/CoreAudio/ALSA); no system libs to redistribute. ASIO is a separate
# opt-in path (feature `asio`) and is NOT enabled by default.
cpal = "0.18"
