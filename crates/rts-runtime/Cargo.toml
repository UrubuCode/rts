[package]
name = "rts-runtime"
version = "0.1.0"
edition = "2024"

# rlib: linked into the `rts` bin for the JIT path.
# staticlib: cargo bundles all deps + the __RTS_* extern "C" symbols into one
#   archive (librts_runtime.a / rts_runtime.lib) that the AOT linker pulls in.
#   This replaces the fragile hand-rolled rustc invocation in build.rs that
#   could not reliably disambiguate duplicate dependency rlib variants on CI.
[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Habilita o backend ASIO (Windows, baixa latência) no namespace `asio_audio`.
# Off por padrão: exige o ASIO SDK da Steinberg + LLVM/libclang no build, e o
# código `asio_audio` só é compilado quando esta feature está ativa.
# Ative com: cargo build --features rts-runtime/asio  (ou -p rts-runtime --features asio)
asio = ["rts-std/asio"]

[dependencies]
# rts-runtime virou FACADE fino: re-exporta engine+shared+std (namespaces/mod.rs)
# e só hospeda globals/dataview localmente (SKIP por design, #1378). Não usa mais
# nenhuma crate externa diretamente — todas migraram com seus módulos pra rts-std/
# rts-shared/rts-engine. O staticlib AOT continua completo: cargo bundla TODA a
# closure transitiva (tokio/ureq/sha2/... via rts-std; regex/serde via rts-shared;
# heap GC via rts-engine) + os símbolos __RTS_* no archive.
rts-engine = { path = "../rts-engine" }
rts-primitives = { path = "../rts-primitives" }
rts-shared = { path = "../rts-shared" }
rts-std = { path = "../rts-std" }
rts-napi = { path = "../rts-napi" }
# rts-egui: liga só `wgpu-backend` (sem o gpu-dx12 do default, que é Windows-only e
# NÃO compila no Linux). O backend de GPU concreto entra por SO nos [target.*]
# abaixo: dx12=Windows, vulkan=Linux, metal=macOS. (Linux também precisa do winit
# x11/wayland — resolvido no Cargo.toml do rts-egui.) Features unem por target.
rts-egui = { path = "../rts-egui", default-features = false, features = [
    "wgpu-backend",
    "glow-backend",
] }

[target.'cfg(target_os = "windows")'.dependencies]
rts-egui = { path = "../rts-egui", default-features = false, features = [
    "gpu-dx12",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rts-egui = { path = "../rts-egui", default-features = false, features = [
    "gpu-vulkan",
] }

[target.'cfg(target_os = "macos")'.dependencies]
rts-egui = { path = "../rts-egui", default-features = false, features = [
    "gpu-metal",
] }
