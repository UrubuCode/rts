[package]
name = "rts-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true

# rlib: nothing needs it yet, and it costs nothing to keep the crate usable from
#   Rust — the AOT half is what this exists for.
# staticlib: cargo bundles the WHOLE transitive closure of this package, plus
#   every `export_name` symbol `#[rtse::entry]` minted in it, into one archive
#   that the AOT linker pulls in.
#
# # Why ONE facade and not a staticlib per crate
#
# Because an archive carries its dependencies. Three archives over
# `rts-core`, `rts-std` and `rts-node` would each carry their own
# copy of everything they share, and the linker would then have to pick between
# duplicates of the same symbol from different rlib variants. That is not a
# hypothetical: `rts-runtime/Cargo.toml` records that its staticlib replaced "the
# fragile hand-rolled rustc invocation in build.rs that could not reliably
# disambiguate duplicate dependency rlib variants on CI", and
# `rts-egui/Cargo.toml` records the size half of the same fact — "a staticlib de
# 1GB era METADE duplicação".
#
# One facade also means one link line. N archives is N orderings to get right.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# Everything this crate's `main` runs is `rts-runtime-boot::run`, over
# `rts-core`/`rts-std`/`rts-node`/`rts-dom-bridge`/`rts-ui` — held there
# rather than here so `rts-runtime-jit` can reuse the SAME sequence without
# depending on THIS crate (and bundling this crate's `main` alongside its
# own — the measured reason for the split is in that crate's `lib.rs`).
rts-runtime-boot = { path = "../rts-runtime-boot" }

[features]
default = ["ui"]
ui = ["rts-runtime-boot/ui"]
