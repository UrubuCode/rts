[package]
name = "rts-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The runtime every target has: values, objects, text, memory, scheduling."

[lib]
crate-type = ["rlib"]

[dependencies]
# The machine layer, for the value encoding only. This crate must agree with it
# bit for bit, and it agrees by READING the same constants rather than copying
# them — so a change to the layout is a compile error here instead of a value
# silently read as the wrong kind.
rts-cranelift = { path = "../rts-cranelift" }

# Substring search. Already in the tree through `regex`, named directly here
# because five string methods search and the naive window compare they share is
# O(n*m) — `memmem` is two-way with a SIMD prefilter, which is what a haystack
# whose match is late actually needs.
#
# Availability, which is what rule 1 asks of a dependency: pure Rust over no
# operating system, so it exists on wasm like everything else here. And it
# decides nothing the machine decides, so it cannot disagree with the machine
# about anything — which is what rule 5 asks.

# The matching engine a regular expression needs. Two of them, and the second is
# not redundancy: `regex` refuses lookaround and backreferences by construction —
# that refusal is what buys its linear time — and JavaScript spells both. So a
# pattern it declines is compiled by `fancy-regex` instead, and a program pays
# for backtracking only where it asked for something that requires it.
#
# Neither decides anything the machine decides, so neither can disagree with it —
# which is what rule 5 is actually about. What they still have to satisfy is
# availability: both are pure Rust over no operating system, so they are present
# on wasm exactly as they are here.
memchr = "2"
regex = "1"
fancy-regex = "0.13"

# The Unicode decomposition and composition tables `String.prototype.normalize`
# is defined by. Carried where a collation table is refused, and the two are not
# the same kind of data: a collation is per-locale — something a program is
# shipped with, which fails rule 1 — where normalisation has one answer that is
# the same everywhere. `crate::text::normalize` states that in full.
#
# Same two questions as the three above. Availability: pure Rust over no
# operating system, so it is on wasm like everything else here. Rule 5: it
# decides nothing the machine decides, so it cannot disagree with the machine.
unicode-normalization = "0.1"

# The authoring surface. A proc macro, so it is a build-time dependency and
# costs nothing at run time — and it emits tokens naming `rts_cranelift::abi`
# rather than depending on it, so using it drags no compiler into anyone build.
rtse = { package = "rts-macro", path = "../rts-macro" }
# CLDR, in Rust, compiled into the binary — what `Intl` is made of.
#
# Availability, which is what rule 1 asks of a dependency: ICU4X exists FOR
# targets that cannot ship a C library or read a data file at run time, which is
# this engine's own situation on wasm. Rule 5 asks the other question — does it
# decide anything the machine decides — and it does not: it answers what a
# number, a date and a list look like in a language, and nothing about values,
# layouts or the heap.
#
# Half of it was already linked here before `Intl` existed: `url` pulls `idna`,
# which pulls `icu_normalizer` and `icu_properties`. So the size this adds is
# the components on top of those, and it is measured in the commit rather than
# guessed at.
#
# `unstable` is enabled and it is a real trade, stated: currency formatting and
# `RelativeTimeFormat` live in `icu_experimental`, which that feature pulls in,
# and there is no stable spelling of either. Without it `Intl.NumberFormat`
# would answer a plain decimal where a program asked for `$1,234.50` — a wrong
# answer that looks right, which is the thing this repository refuses. The cost
# is that those two APIs may change shape across an ICU4X release; the rest of
# the surface does not depend on them.
icu = { version = "2", features = ["unstable"] }
