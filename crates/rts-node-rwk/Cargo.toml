[package]
name = "rts-node-rwk"
version = "0.1.0"
edition = "2024"

[dependencies]
rts-core-rwk = { path = "../rts-core-rwk" }

# Vetted by docs/reference/node/crates.md, added ahead of the modules that need
# them so that several agents writing modules at once never touch this file:
# a manifest is the one place parallel work collides.
url = "2.5"                 # §4.8 — WHATWG URL/URLSearchParams
percent-encoding = "2.3"    # §4.8 — encode/decodeURIComponent building blocks
form_urlencoded = "1.2"     # §4.8 — querystring core
idna = "1.1"                # §4.8 — UTS-46 + punycode
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }  # §4.4 — NEVER the zlib/zlib-ng features, which pull C
brotli = "8.0"              # §4.4 — brotli, pure Rust
encoding_rs = "0.8"         # §4.9 — WHATWG label set for string_decoder

# node:tls, per crates.md §6 — the owner decision is a PURE-Rust CryptoProvider
# assembled from the RustCrypto crates node:crypto already uses, and `ring`
# (C + assembly) and `aws-lc-rs` (C) are both rejected by §5. rustls itself is
# pure; only its two built-in providers are not, so none is enabled.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1.0"        # §3 — the CA store; NOT rustls-native-certs, which links schannel/Security.framework
aes-gcm = "0.10"            # §6 — AEAD
chacha20poly1305 = "0.10"   # §6 — AEAD
x25519-dalek = { version = "2", features = ["static_secrets"] }  # §6 — key exchange.
                            # The feature is not optional: without it every constructor that
                            # builds a secret from raw bytes is gated off, and the provider has
                            # to substitute P-256 — which is not what a TLS 1.3 peer offers first.
p256 = "0.13"               # §6 — ECDH + ECDSA
p384 = "0.13"               # §6 — ECDH + ECDSA
ed25519-dalek = "2"         # §6 — signatures
rsa = "0.9"                 # §6 — signatures. RUSTSEC-2023-0071 (Marvin) applies to RSA
                            # DECRYPTION; TLS 1.3 uses RSA only to sign, which is what limits it.


# node:sqlite — §4.12. Pure-Rust, SQLite-file-compatible. The feature pin is not
# cosmetic: stock defaults pull `aegis`, which cc-compiles C on Windows and
# Linux, and `pure-rust-crypto` forces the softaes backend instead. MIT.
turso_core = { version = "0.6", default-features = false, features = ["fs", "uuid", "time", "json", "series", "pure-rust-crypto"] }
# `percentile` is in §4.12's pin list and does not exist in turso_core 0.6 —
# the document drifted from the crate. Dropped rather than the version being
# bent to match a feature nobody needs.

# node:wasi — §4.13. A pure-Rust interpreter, audited by Runtime Verification in
# 2024, MIT/Apache. `wasmtime` is rejected by that section: it cc-compiles C for
# any real execution and vendors its own Cranelift fork against the one this
# workspace pins. An interpreter is slower than a JIT and is the correct trade.
wasmi = "0.31"

# FFI *declaration* crate over libc/OS syscalls (chown/lchown/fchown, utimensat/
# futimens) — ACCEPTED per docs/reference/node/crates.md §2: "libc-as-FFI-
# declaration is accepted (the project already links it); only a C
# compile/vendor step is rejected." No C is compiled by this dependency.
libc = "0.2"

# fs.globSync — vetted in docs/reference/node/crates.md §4.14 ("fs-misc
# (foundation)"): "tempfile · glob (ws) · globset · bytes (ws) ... temp files,
# glob, byte buffers", already a workspace-resolvable version (0.3, MIT/Apache).
glob = "0.3"

# fs.watch/FSWatcher — vetted in docs/reference/node/crates.md §3 ("Already in
# the workspace (reuse first)") and §4.14: "notify | ... | fs.watch (declared,
# unused)" / "notify (ws) | bump→8.2 | CC0 | fs.watch". Declared at the
# workspace root (`notify = "6.1"`) but unused until this change.
notify = "6.1"

# node:crypto — every crate below is listed by name in crates.md §4.1
# ("crypto — hash / MAC / KDF / random"), which is what CLAUDE.md's RULE 0b/
# the task brief means by "already vetted": "sha2 (ws) ... SHA-224/256/384/512"
# / "sha1 ... SHA-1" / "md-5 ... MD5 (import `md5`)" / "sha3 ... SHA3/Keccak"
# / "blake2 ... BLAKE2b/2s" / "ripemd ... RIPEMD-160" / "digest · hmac · hkdf
# · pbkdf2 · scrypt ... trait plumbing + HMAC + KDFs" / "getrandom ...
# randomBytes/randomFillSync/getRandomValues". `uuid` is NOT added — §4.1
# lists it as optional ("or hand-roll, zero-dep") and randomUUID is hand-rolled
# here (16 CSPRNG bytes + RFC 4122 v4 bit twiddling) per that note.
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
sha3 = "0.12"
blake2 = "0.11.0-rc.6"
ripemd = "0.2"
digest = "0.11"
hmac = "0.13"
hkdf = "0.13"
pbkdf2 = "0.13"
scrypt = "0.12"
getrandom = "0.4"
