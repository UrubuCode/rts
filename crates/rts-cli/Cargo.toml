[package]
name = "rts-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

# A janela, repassada do host.
#
# Sem isto `ui` existia no `rts-host` e não havia como PEDIR: nada entre o
# binário e ele repassava a feature, então `rts run jogo.ts` importava
# `rts:egui` com zero membros — uma UI que compila e não pinta, que é
# exatamente o modo de falhar que `rts-std` recusou uma vez ao não registrar um
# `rts:egui` de fachada. A superfície estava pronta e inalcançável.
#
# Fora do default aqui pelo mesmo motivo que lá: uma janela é uma questão de
# DISPONIBILIDADE, e um alvo sem tela não deve arrastar wgpu e winit para o
# grafo para descobrir isso.
[features]
ui = ["rts-host/ui"]

[dependencies]
# The engine. Every command runs through it: `run`, `eval`, `test`, `compile`,
# `ir`, and `emit-types` — which is what let `rts-codegen-new` be deleted.
rts-host = { path = "../rts-host" }
# Named directly for `rts emit-types` alone: the declared type surface is a fact
# about the runtime, and reaching it through the host would make the host
# re-export something it has no other reason to know about.
rts-core = { path = "../rts-core" }
# `rts napi <file.node>`: the only binary that exports the `napi_*` symbols is
# `rts`, so the only place an addon can be loaded is from inside it.
rts-napi-rwk = { path = "../rts-napi-rwk" }
rts-std = { path = "../rts-std" }
rts-linker = { path = "../rts-linker" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.12", default-features = true }
colored = "2.1"
console = "0.15"
indicatif = "0.18"
flate2 = "1.1"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
