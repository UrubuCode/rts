[package]
name = "rts-value-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Measurement-only crate. Depends on NOTHING from RTS on purpose: it replicates
# the shapes under test (sharded mutex slab, PolyValue NaN-box, the __rtsadp_*
# call profile) in isolation so a number cannot be contaminated by unrelated
# runtime work. See README.md for what it does and does NOT prove.
[dependencies]
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
indexmap = "2"
regex = "1"

[[bin]]
name = "rts-value-probe"
path = "src/main.rs"
